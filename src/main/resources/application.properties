spring.application.name=dental-implant-db

# Database Configuration (Google Cloud SQL - MySQL)
spring.datasource.url=jdbc:mysql:///implant_finder?cloudSqlInstance=sonorous-mix-511409-k3:asia-southeast1:free-trial-first-project&socketFactory=com.google.cloud.sql.mysql.SocketFactory&sslMode=DISABLED&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=implant_admin
spring.datasource.password=${DB_PASSWORD}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (Disabled)
spring.h2.console.enabled=false

# SQL Initialization
spring.sql.init.mode=never

# Server Configuration
server.forward-headers-strategy=framework
server.tomcat.use-relative-redirects=true

# Upload Configuration
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
