<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#f0f4f9] p-8 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-3xl shadow-sm border border-slate-100 w-full max-w-4xl overflow-hidden grid grid-cols-1 md:grid-cols-3">
        <div class="bg-[#0b2545] p-8 text-white flex flex-col items-center justify-center text-center">
            <div class="w-32 h-32 rounded-full border-4 border-blue-500 overflow-hidden mb-4 bg-teal-100 flex items-center justify-center text-4xl">
                👩‍💼
            </div>
            <h2 class="text-xl font-black mb-1">Admin User</h2>
            <p class="text-xs text-blue-300 mb-6">@implantadmin</p>
            <button class="px-6 py-2 bg-white/10 hover:bg-white/20 text-white rounded-full text-xs font-bold transition border border-white/20">Choose Avatar</button>
        </div>

        <div class="md:col-span-2 p-8">
            <h2 class="text-xl font-extrabold text-slate-900 mb-6">Account</h2>
            <form th:action="@{/admin/profile}" th:object="${admin}" method="post" class="space-y-4">
                <input type="hidden" th:field="*{adminId}">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Name</label>
                        <input type="text" th:field="*{fullName}" class="w-full p-3 bg-slate-50 border-none rounded-xl text-xs font-medium">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Username</label>
                        <input type="text" th:field="*{username}" class="w-full p-3 bg-slate-50 border-none rounded-xl text-xs font-medium">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Email</label>
                    <input type="email" th:field="*{email}" class="w-full p-3 bg-slate-50 border-none rounded-xl text-xs font-medium">
                </div>

                <hr class="my-6 border-slate-100">
                <h3 class="text-sm font-extrabold text-slate-900 mb-4">Password</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">New password</label>
                        <input type="password" class="w-full p-3 bg-slate-50 border-none rounded-xl text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Confirm password</label>
                        <input type="password" class="w-full p-3 bg-slate-50 border-none rounded-xl text-xs">
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-8">
                    <a href="/admin/data-management" class="px-5 py-2.5 bg-slate-100 text-slate-600 rounded-xl font-bold text-xs">Cancel</a>
                    <button type="submit" class="px-6 py-2.5 bg-[#2563eb] text-white rounded-xl font-bold text-xs shadow-sm">Save</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
