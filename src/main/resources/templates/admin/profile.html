<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Profile | Implant Finder</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
</head>
<body class="profile-body-page">

    <!-- ===== Navbar ===== -->
    <header class="topbar">
        <a th:href="@{/admin/data-management}" class="site-logo" aria-label="Implant Finder admin">
            <img th:src="@{/images/logo.png}" alt="Implant Finder">
        </a>
    </header>

    <!-- ===== Toast: แสดงชั่วคราวแล้วหายเอง (เช่น หลังเปลี่ยน Avatar) ===== -->
    <div th:if="${successMessage}" class="profile-toast" role="status" aria-live="polite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>
        <span th:text="${successMessage}">Avatar updated successfully!</span>
    </div>

    <main class="profile-page">

        <!-- ===== Back + Breadcrumb ===== -->
        <nav class="page-nav" aria-label="Breadcrumb">
            <a th:href="@{/admin/data-management}" class="back-btn" title="Back to admin" aria-label="Back to admin">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m0 0l6-6m-6 6l6 6"/>
                </svg>
            </a>
            <div class="crumbs">
                <a th:href="@{/admin/data-management}">Admin</a>
                <svg class="chev" viewBox="0 0 11 16" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2.5 8.5 8 3 13.5"/></svg>
                <span>Profile</span>
            </div>
        </nav>

        <!-- ===== กล่องหลัก ===== -->
        <section class="profile-card">

            <!-- ซ้าย: Avatar -->
            <aside class="profile-side">
               <img class="profile-avatar"
     th:src="${admin.avatarLink != null and #strings.startsWith(admin.avatarLink, '/images/avatars/')} ? @{${admin.avatarLink}} : @{/images/avatars/avatar1.png}"
     alt="Admin avatar">

                <h2 class="profile-name" th:text="${#strings.isEmpty(admin.fullName)} ? 'Admin User' : ${admin.fullName}">Admin User</h2>
                <p class="profile-username" th:text="${admin.username}">@implantadmin</p>

                <a th:href="@{/admin/avatar}" class="choose-avatar-btn">Choose Avatar</a>
            </aside>

            <!-- ขวา: ฟอร์ม -->
            <form th:action="@{/admin/profile}" th:object="${admin}" method="post" class="profile-form">
                <input type="hidden" th:field="*{adminId}">
                <input type="hidden" th:field="*{avatarLink}">

                <p th:if="${errorMessage}" class="profile-alert profile-alert-error" th:text="${errorMessage}"></p>

                <!-- Account -->
                <h1 class="profile-section-title">Account</h1>

                <div class="profile-grid">
                    <div class="profile-field">
                        <label for="fullName" class="profile-label">Name</label>
                        <input type="text" id="fullName" th:field="*{fullName}" class="profile-input">
                    </div>
                    <div class="profile-field">
                        <label for="username" class="profile-label">Username</label>
                        <input type="text" id="username" th:field="*{username}" class="profile-input">
                    </div>
                    <div class="profile-field">
                        <label for="email" class="profile-label">Email</label>
                        <input type="email" id="email" th:field="*{email}" class="profile-input">
                    </div>
                </div>

                <hr class="profile-divider">

                <!-- Password -->
                <h2 class="profile-section-title">Password</h2>

                <div class="profile-grid">
                    <div class="profile-field">
                        <label for="newPassword" class="profile-label">New password</label>
                        <input type="password" id="newPassword" name="newPassword" class="profile-input"
                               autocomplete="new-password">
                    </div>
                    <div class="profile-field">
                        <label for="confirmPassword" class="profile-label">Confirm password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="profile-input"
                               autocomplete="new-password">
                    </div>
                    <div class="profile-field">
                        <label for="currentPassword" class="profile-label">Current password</label>
                        <input type="password" id="currentPassword" name="currentPassword" class="profile-input"
                               autocomplete="current-password">
                    </div>
                </div>

                <!-- ปุ่มล่าง -->
                <div class="profile-actions">
                    <a th:href="@{/admin/data-management}" class="profile-cancel">Cancel</a>
                    <button type="submit" class="profile-save">Save</button>
                </div>
            </form>
        </section>
    </main>

</body>
</html>
