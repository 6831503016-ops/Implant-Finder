<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Admin Profile</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/profile.css}">
</head>

<body class="bg-white min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="navbar">

        <a href="/admin/data-management" class="navbar-brand">
            <span class="navbar-brand-icon">🦷</span>
            <span>Implant-Finder</span>
        </a>

        <svg class="breadcrumb-arrow"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor"
             stroke-width="2.5">
            <path stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M9 5l7 7-7 7"/>
        </svg>

        <span class="breadcrumb-current">
            Profile
        </span>

    </header>


    <!-- Profile Layout -->
    <div class="profile-layout">

        <!-- Left Side -->
        <div class="profile-sidebar">

            <!-- Avatar -->
            <div class="profile-avatar">
                <img th:src="${#strings.isEmpty(admin.avatarLink) ? 'https://api.dicebear.com/7.x/bottts/svg?seed=Admin1' : admin.avatarLink}"
                     alt="Admin Avatar"
                     class="profile-avatar-image">
            </div>

            <h2 class="profile-name">
                Admin User
            </h2>

            <p class="profile-username">
                @implantadmin
            </p>

            <a href="/admin/avatar"
               class="choose-avatar-button">
                Choose Avatar
            </a>

        </div>


        <!-- Right Side -->
        <div class="profile-content">

            <form th:action="@{/admin/profile}"
                  th:object="${admin}"
                  method="post"
                  class="profile-form">

                <input type="hidden" th:field="*{adminId}">
                <input type="hidden" th:field="*{avatarLink}">


                <!-- Form Content -->
                <div class="profile-form-content">

                    <h2 class="section-title">
                        Account
                    </h2>


                    <!-- Name and Username -->
                    <div class="form-grid">

                        <div class="form-group">
                            <label class="form-label">
                                Name
                            </label>

                            <input type="text"
                                   th:field="*{fullName}"
                                   class="form-input">
                        </div>


                        <div class="form-group">
                            <label class="form-label">
                                Username
                            </label>

                            <input type="text"
                                   th:field="*{username}"
                                   class="form-input">
                        </div>

                    </div>


                    <!-- Email -->
                    <div class="form-grid">

                        <div class="form-group">
                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   th:field="*{email}"
                                   class="form-input">
                        </div>

                    </div>


                    <hr class="form-divider">


                    <!-- Password -->
                    <h3 class="section-subtitle">
                        Password
                    </h3>


                    <!-- New Password and Confirm Password -->
                    <div class="form-grid">

                        <div class="form-group">
                            <label class="form-label">
                                New password
                            </label>

                            <input type="password"
                                   name="newPassword"
                                   class="form-input">
                        </div>


                        <div class="form-group">
                            <label class="form-label">
                                Confirm password
                            </label>

                            <input type="password"
                                   name="confirmPassword"
                                   class="form-input">
                        </div>

                    </div>


                    <!-- Current Password -->
                    <div class="form-grid">

                        <div class="form-group">
                            <label class="form-label">
                                Current password
                            </label>

                            <input type="password"
                                   name="currentPassword"
                                   class="form-input">
                        </div>

                    </div>

                </div>


                <!-- Form Actions -->
                <div class="form-actions">

                    <a href="/admin/data-management"
                       class="cancel-button">
                        Cancel
                    </a>

                    <button type="submit"
                            class="save-button">
                        Save
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
