<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Profile</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
</head>
<body>
<div class="profile-layout">

    <!-- ===== ซ้าย: Avatar ===== -->
    <aside class="profile-side">
        <img class="profile-avatar"
             th:src="${#strings.isEmpty(admin.avatarLink)} ? 'https://api.dicebear.com/7.x/personas/svg?seed=Admin1&backgroundColor=efe9df' : ${admin.avatarLink}"
             alt="Admin avatar">

        <h2 class="profile-name" th:text="${#strings.isEmpty(admin.fullName)} ? 'Admin User' : ${admin.fullName}">Admin User</h2>
        <p class="profile-username" th:text="${admin.username}">@implantadmin</p>

        <a th:href="@{/admin/avatar}" class="choose-avatar-btn">Choose Avatar</a>
    </aside>

    <!-- ===== ขวา: ฟอร์ม ===== -->
    <div class="profile-main">
        <div class="profile-band"></div>

        <form th:action="@{/admin/profile}" th:object="${admin}" method="post" class="profile-form">
            <input type="hidden" th:field="*{adminId}">
            <input type="hidden" th:field="*{avatarLink}">

            <div class="profile-body">

                <p th:if="${successMessage}" class="profile-alert profile-alert-ok" th:text="${successMessage}"></p>
                <p th:if="${errorMessage}" class="profile-alert profile-alert-error" th:text="${errorMessage}"></p>

                <!-- Account -->
                <h1 class="profile-section-title">Account</h1>

                <div class="profile-grid">
                    <div class="profile-field">
                        <label for="fullName" class="profile-label">Name</label>
                        <input type="text" id="fullName" th:field="*{fullName}" class="profile-input">
                    </div>
                    <div class="profile-field">
                        <label for="username" class="profile-label">Username</label>
                        <input type="text" id="username" th:field="*{username}" class="profile-input">
                    </div>
                    <div class="profile-field">
                        <label for="email" class="profile-label">Email</label>
                        <input type="email" id="email" th:field="*{email}" class="profile-input">
                    </div>
                </div>

                <hr class="profile-divider">

                <!-- Password -->
                <h2 class="profile-section-title">Password</h2>

                <div class="profile-grid profile-grid-password">
                    <div class="profile-field">
                        <label for="newPassword" class="profile-label">New password</label>
                        <input type="password" id="newPassword" name="newPassword" class="profile-input"
                               autocomplete="new-password">
                    </div>
                    <div class="profile-field">
                        <label for="confirmPassword" class="profile-label">Confirm password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="profile-input"
                               autocomplete="new-password">
                    </div>
                    <div class="profile-field">
                        <label for="currentPassword" class="profile-label">Current password</label>
                        <input type="password" id="currentPassword" name="currentPassword" class="profile-input"
                               autocomplete="current-password">
                    </div>
                </div>
            </div>

            <!-- ปุ่มล่าง -->
            <div class="profile-footer">
                <a th:href="@{/admin/data-management}" class="profile-cancel">Cancel</a>
                <button type="submit" class="profile-save">Save</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
