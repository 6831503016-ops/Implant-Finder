<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#f0f4f9] p-8 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-[2rem] shadow-sm border border-slate-100 w-full max-w-6xl min-h-[620px] overflow-hidden grid grid-cols-1 md:grid-cols-3">
        <div class="bg-[#0b2545] p-12 text-white flex flex-col items-center justify-center text-center">
            <div class="w-44 h-44 rounded-full border-[6px] border-blue-500 overflow-hidden mb-6 bg-teal-100 flex items-center justify-center text-7xl">
                👩‍💼
            </div>
            <h2 class="text-3xl font-black mb-2">Admin User</h2>
            <p class="text-base text-blue-300 mb-8">@implantadmin</p>
            <button class="px-8 py-3 bg-white/10 hover:bg-white/20 text-white rounded-full text-sm font-bold transition border border-white/20">Choose Avatar</button>
        </div>

        <div class="md:col-span-2 p-12">
            <h2 class="text-3xl font-extrabold text-slate-900 mb-8">Account</h2>
            <form th:action="@{/admin/profile}" th:object="${admin}" method="post" class="space-y-6">
                <input type="hidden" th:field="*{adminId}">
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Name</label>
                        <input type="text" th:field="*{fullName}" class="w-full px-5 py-4 bg-slate-50 border-none rounded-2xl text-base font-medium focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Username</label>
                        <input type="text" th:field="*{username}" class="w-full px-5 py-4 bg-slate-50 border-none rounded-2xl text-base font-medium focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Email</label>
                    <input type="email" th:field="*{email}" class="w-full px-5 py-4 bg-slate-50 border-none rounded-2xl text-base font-medium focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <hr class="my-8 border-slate-100">
                <h3 class="text-xl font-extrabold text-slate-900 mb-6">Password</h3>
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">New password</label>
                        <input type="password" class="w-full px-5 py-4 bg-slate-50 border-none rounded-2xl text-base focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Confirm password</label>
                        <input type="password" class="w-full px-5 py-4 bg-slate-50 border-none rounded-2xl text-base focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div class="flex justify-end gap-4 mt-10">
                    <a href="/admin/data-management" class="px-8 py-3.5 bg-slate-100 text-slate-600 rounded-2xl font-bold text-sm">Cancel</a>
                    <button type="submit" class="px-10 py-3.5 bg-[#2563eb] hover:bg-blue-700 text-white rounded-2xl font-bold text-sm shadow-sm transition">Save</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
