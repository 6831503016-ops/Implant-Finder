<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose Avatar</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/avatar.css}">
</head>

<body>

<main class="avatar-container">

    <!-- Page Heading -->
    <h1 class="page-title">
        Choose Your Avatar
    </h1>

    <p class="page-description">
        Select your favorite avatar and confirm your choice.
    </p>


    <!-- Avatar Form -->
    <form th:action="@{/admin/avatar}" method="post">

        <!-- Avatar List -->
        <div class="avatar-grid">

            <!-- Avatar 1 -->
            <div class="avatar-option">
                <input type="radio"
                       name="avatarLink"
                       id="avatar1"
                       value="https://api.dicebear.com/7.x/bottts/svg?seed=Admin1"
                       required>

                <label for="avatar1" class="avatar-card">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Admin1"
                         alt="Admin avatar"
                         class="avatar-image">

                    <span class="avatar-name">Admin</span>
                </label>
            </div>


            <!-- Avatar 2 -->
            <div class="avatar-option">
                <input type="radio"
                       name="avatarLink"
                       id="avatar2"
                       value="https://api.dicebear.com/7.x/bottts/svg?seed=Alex">

                <label for="avatar2" class="avatar-card">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Alex"
                         alt="Alex avatar"
                         class="avatar-image">

                    <span class="avatar-name">Alex</span>
                </label>
            </div>


            <!-- Avatar 3 -->
            <div class="avatar-option">
                <input type="radio"
                       name="avatarLink"
                       id="avatar3"
                       value="https://api.dicebear.com/7.x/bottts/svg?seed=Mia">

                <label for="avatar3" class="avatar-card">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Mia"
                         alt="Mia avatar"
                         class="avatar-image">

                    <span class="avatar-name">Mia</span>
                </label>
            </div>


            <!-- Avatar 4 -->
            <div class="avatar-option">
                <input type="radio"
                       name="avatarLink"
                       id="avatar4"
                       value="https://api.dicebear.com/7.x/bottts/svg?seed=Sam">

                <label for="avatar4" class="avatar-card">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Sam"
                         alt="Sam avatar"
                         class="avatar-image">

                    <span class="avatar-name">Sam</span>
                </label>
            </div>


            <!-- Avatar 5 -->
            <div class="avatar-option">
                <input type="radio"
                       name="avatarLink"
                       id="avatar5"
                       value="https://api.dicebear.com/7.x/bottts/svg?seed=Taylor">

                <label for="avatar5" class="avatar-card">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Taylor"
                         alt="Taylor avatar"
                         class="avatar-image">

                    <span class="avatar-name">Taylor</span>
                </label>
            </div>


            <!-- Avatar 6 -->
            <div class="avatar-option">
                <input type="radio"
                       name="avatarLink"
                       id="avatar6"
                       value="https://api.dicebear.com/7.x/bottts/svg?seed=Jordan">

                <label for="avatar6" class="avatar-card">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Jordan"
                         alt="Jordan avatar"
                         class="avatar-image">

                    <span class="avatar-name">Jordan</span>
                </label>
            </div>

        </div>


        <!-- Form Actions -->
        <div class="form-actions">

            <a href="/admin/profile" class="cancel-button">
                Cancel
            </a>

            <button type="submit" class="confirm-button">
                Confirm Avatar
            </button>

        </div>

    </form>

</main>

</body>
</html>
