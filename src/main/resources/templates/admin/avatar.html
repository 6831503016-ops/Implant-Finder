
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose Avatar | Implant Finder</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/avatar.css}">
</head>
<body class="avatar-body">

    <!-- ===== Navbar ===== -->
    <header class="topbar">
        <a th:href="@{/admin/data-management}" class="site-logo" aria-label="Implant Finder admin">
            <img th:src="@{/images/logo.png}" alt="Implant Finder">
        </a>
    </header>

    <main class="avatar-main">

        <!-- ===== Back + Breadcrumb ===== -->
        <nav class="page-nav" aria-label="Breadcrumb">
            <a th:href="@{/admin/profile}" class="back-btn" title="Back to profile" aria-label="Back to profile">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m0 0l6-6m-6 6l6 6"/>
                </svg>
            </a>
            <div class="crumbs">
                <a th:href="@{/admin/data-management}">Admin</a>
                <svg class="chev" viewBox="0 0 11 16" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2.5 8.5 8 3 13.5"/></svg>
                <a th:href="@{/admin/profile}">Profile</a>
                <svg class="chev" viewBox="0 0 11 16" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2.5 8.5 8 3 13.5"/></svg>
                <span>Choose Avatar</span>
            </div>
        </nav>

        <!-- ===== กรอบหลัก ===== -->
        <section class="avatar-card">

                       <!-- หัวกรอบ: รูปที่เลือกอยู่ + หัวข้อ -->
            <header class="avatar-head">
                <img id="avatarPreview" class="avatar-current"
                     th:src="${admin.avatarLink != null and #strings.startsWith(admin.avatarLink, '/images/avatars/')} ? @{${admin.avatarLink}} : @{/images/avatars/avatar1.png}" alt="Selected avatar">
                <div>
                    <h1 class="avatar-title">Choose Your Avatar</h1>
                    <p class="avatar-description">Select your favorite avatar and confirm your choice.</p>
                </div>
            </header>

            <form th:action="@{/admin/avatar}" method="post" class="avatar-form">

                <!-- รายการ avatar มาจาก ProfileController (AVATARS) -->
                <div class="avatar-grid">
                    <label th:each="url, stat : ${avatars}" class="avatar-option">
                        <input type="radio" name="avatarLink" th:value="${url}" required
                               th:checked="${admin.avatarLink == url}">
                        <span class="avatar-tile">
                            <img th:src="${url}" th:alt="${'Avatar ' + stat.count}" class="avatar-image">
                            <span class="avatar-name" th:text="${'Avatar ' + stat.count}">Avatar</span>
                            <span class="avatar-check" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                                     stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>
                            </span>
                        </span>
                    </label>
                </div>

                <div class="avatar-actions">
                    <a th:href="@{/admin/profile}" class="avatar-cancel">Cancel</a>
                    <button type="submit" class="avatar-confirm">Confirm Avatar</button>
                </div>
            </form>
        </section>
    </main>

    <!-- ===== JavaScript ===== -->
    <script th:src="@{/js/avatar-selection.js}"></script>

</body>
</html>
