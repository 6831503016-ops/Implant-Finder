<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Implant Model</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/add-model.css}">
</head>

<body>

<div class="page-layout">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="sidebar-brand">
            <span class="sidebar-brand-icon">🦷</span>
            <span class="sidebar-brand-name">Implant</span>
        </div>

    </aside>


    <!-- Main Content -->
    <div class="main-content">

        <!-- Navbar -->
        <header class="navbar">

            <a href="/" class="navbar-brand">
                <span class="navbar-brand-icon">🦷</span>
                <span>Implant</span>
            </a>

            <svg class="breadcrumb-arrow"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor"
                 stroke-width="2.5">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M9 5l7 7-7 7"/>
            </svg>

            <a href="/admin/data-management" class="breadcrumb-link">
                Implant Data
            </a>

            <svg class="breadcrumb-arrow"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor"
                 stroke-width="2.5">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M9 5l7 7-7 7"/>
            </svg>

            <span class="breadcrumb-current">
                Add Implant Model
            </span>

        </header>


        <!-- Page Content -->
        <main class="page-container">

            <!-- Page Header -->
            <div class="page-header">

                <div class="page-heading">

                    <!-- Back Button -->
                    <a href="/admin/data-management"
                       title="Back"
                       class="back-button">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             fill="none"
                             viewBox="0 0 24 24"
                             stroke="currentColor"
                             stroke-width="1.8">
                            <path stroke-linecap="round"
                                  stroke-linejoin="round"
                                  d="M19 12H5m0 0l6-6m-6 6l6 6"/>
                        </svg>

                    </a>

                    <div>
                        <h1 class="page-title">
                            Add Implant Model
                        </h1>

                        <p class="page-description">
                            Fill in the image, details and sizes, then press Save
                        </p>
                    </div>

                </div>


                <!-- Page Actions -->
                <div class="page-actions">

                    <a href="/admin/data-management"
                       class="cancel-button">
                        Cancel
                    </a>

                    <button form="addForm"
                            type="submit"
                            class="save-button">
                        Save
                    </button>

                </div>

            </div>


            <!-- Add Model Form -->
            <form id="addForm"
                  th:action="@{/admin/add-model}"
                  th:object="${implant}"
                  method="post"
                  class="model-form">


                <!-- Image Section -->
                <section class="image-card">

                    <div class="image-preview-container">

                        <img id="imagePreview"
                             src="https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?w=500&auto=format&fit=crop"
                             class="image-preview"
                             alt="Preview">

                    </div>

                    <label for="imageUrl" class="form-label">
                        Image URL
                    </label>

                    <input id="imageUrl"
                           type="url"
                           th:field="*{imageUrl}"
                           placeholder="https://example.com/image.jpg"
                           class="form-input">

                </section>


                <!-- Right Side -->
                <div class="form-content">

                    <!-- Model Information -->
                    <section class="form-card">

                        <div class="form-grid">

                            <!-- Brand -->
                            <div class="form-group">

                                <label class="form-label">
                                    Brand
                                </label>

                                <input type="text"
                                       name="brandName"
                                       required
                                       placeholder="Enter brand name"
                                       class="form-input">

                            </div>


                            <!-- Model Name -->
                            <div class="form-group">

                                <label class="form-label">
                                    Model name
                                </label>

                                <input type="text"
                                       th:field="*{modelName}"
                                       required
                                       class="form-input">

                            </div>


                            <!-- Material -->
                            <div class="form-group">

                                <label class="form-label">
                                    Material
                                </label>

                                <input type="text"
                                       name="materialName"
                                       class="form-input">

                            </div>


                            <!-- Type -->
                            <div class="form-group">

                                <label class="form-label">
                                    Type
                                </label>

                                <input type="text"
                                       th:field="*{type}"
                                       class="form-input">

                            </div>

                        </div>

                    </section>


                    <!-- Sizes -->
                    <section class="form-card">

                        <h3 class="section-title">
                            Sizes
                        </h3>

                        <input type="text"
                               th:field="*{sizes}"
                               placeholder="Ø 4.3 x 10 mm, Ø 4.3 x 8.5 mm"
                               class="form-input">

                    </section>

                </div>

            </form>

        </main>

    </div>

</div>


<!-- Image Preview Script -->
<script>
    const imageUrlInput = document.getElementById('imageUrl');
    const imagePreview = document.getElementById('imagePreview');

    imageUrlInput.addEventListener('input', () => {
        if (imageUrlInput.value) {
            imagePreview.src = imageUrlInput.value;
        }
    });
</script>

</body>
</html>
