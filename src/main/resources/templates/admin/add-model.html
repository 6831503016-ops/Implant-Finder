<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Implant Model</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#f0f4f9] flex min-h-screen">
    <div class="w-64 bg-[#0a192f] text-white p-6 space-y-8">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🦷</span>
            <span class="text-xl font-bold">Implant</span>
        </div>
    </div>

    <div class="flex-1 p-8">
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-4">
                <a href="/admin/data-management" class="w-9 h-9 bg-white rounded-xl shadow-sm flex items-center justify-center font-bold text-slate-700">←</a>
                <div>
                    <h1 class="text-2xl font-black text-slate-900">Add Implant Model</h1>
                    <p class="text-xs text-slate-400 font-medium">Fill in the image, details and sizes, then press Save</p>
                </div>
            </div>
            <div class="flex gap-3">
                <a href="/admin/data-management" class="px-5 py-2 bg-white rounded-xl font-bold text-xs text-slate-600 shadow-sm border">Cancel</a>
                <button form="addForm" type="submit" class="px-6 py-2 bg-[#2563eb] text-white rounded-xl font-bold text-xs shadow-sm">Save</button>
            </div>
        </div>

        <form id="addForm" th:action="@{/admin/add-model}" th:object="${implant}" method="post" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex flex-col items-center justify-center text-center">
                <div class="bg-black w-full h-64 rounded-2xl flex items-center justify-center mb-4">
                    <img id="imagePreview" src="https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?w=500&auto=format&fit=crop" class="max-h-56 object-contain" alt="Preview">
                </div>
                <label for="imageUrl" class="w-full text-left text-xs font-bold text-slate-700 mb-1">Image URL</label>
                <input id="imageUrl" type="url" th:field="*{imageUrl}" placeholder="https://example.com/image.jpg" class="w-full p-3 bg-slate-50 border-none rounded-xl text-xs outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="md:col-span-2 space-y-6">
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 grid grid-cols-2 gap-4">
                   <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Brand</label>
                       
                      <input type="text"
                      name="brandName"
                      required
                      placeholder="Enter brand name"
                      class="w-full p-3 bg-slate-50 border-none rounded-xl text-xs outline-none focus:ring-2 focus:ring-blue-500">

                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Model name</label>
                        <input type="text" th:field="*{modelName}" required class="w-full p-3 bg-slate-50 border-none rounded-xl text-xs outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Material</label>
                        <input type="text" th:field="*{material}" class="w-full p-3 bg-slate-50 border-none rounded-xl text-xs outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Type</label>
                        <input type="text" th:field="*{type}" class="w-full p-3 bg-slate-50 border-none rounded-xl text-xs outline-none">
                    </div>
                </div>

                <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-900 text-sm mb-4">Sizes</h3>
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Diameter (mm)</label>
                            <input type="text" value="4.3" class="w-full p-3 bg-slate-50 border-none rounded-xl text-xs">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Lengths (mm, separate with commas)</label>
                            <input type="text" th:field="*{sizes}" value="8.5, 10, 11.5, 13" class="w-full p-3 bg-slate-50 border-none rounded-xl text-xs">
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <span class="px-3 py-1.5 bg-blue-50 text-blue-600 rounded-full text-xs font-bold border border-blue-100">Ø 3.5 × 10 ×</span>
                        <span class="px-3 py-1.5 bg-blue-50 text-blue-600 rounded-full text-xs font-bold border border-blue-100">Ø 4.3 × 8.5 ×</span>
                        <span class="px-3 py-1.5 bg-blue-50 text-blue-600 rounded-full text-xs font-bold border border-blue-100">Ø 4.3 × 10 ×</span>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <script>
        const imageUrlInput = document.getElementById('imageUrl');
        const imagePreview = document.getElementById('imagePreview');

        imageUrlInput.addEventListener('input', () => {
            if (imageUrlInput.value) {
                imagePreview.src = imageUrlInput.value;
            }
        });
    </script>
</body>
</html>
