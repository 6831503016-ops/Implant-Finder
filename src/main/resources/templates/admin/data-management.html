<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Implant Data Management</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/data-management.css}">
</head>

<body class="page-body">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-content">

            <!-- Sidebar -->
<div class="sidebar-brand">
    <img th:src="@{/images/logo.png}" alt="Implant Finder" class="navbar-brand-logo">
</div>

            <nav class="sidebar-navigation">

                <a href="/admin/data-management"
                   class="navigation-link navigation-link-active">

                    <svg class="navigation-icon"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         stroke-linecap="round"
                         stroke-linejoin="round"
                         aria-hidden="true">
                        <ellipse cx="12" cy="5" rx="8" ry="3"/>
                        <path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/>
                        <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
                    </svg>

                    <span>Implant Data</span>
                </a>

                <a href="/admin/profile"
                   class="navigation-link">

                    <svg class="navigation-icon"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         stroke-linecap="round"
                         stroke-linejoin="round"
                         aria-hidden="true">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 21a8 8 0 0 1 16 0"/>
                    </svg>

                    <span>Profile</span>
                </a>

                <a href="/admin/logout"
                   class="navigation-link navigation-link-logout">

                    <svg class="navigation-icon"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         stroke-linecap="round"
                         stroke-linejoin="round"
                         aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <path d="m16 17 5-5-5-5"/>
                        <path d="M21 12H9"/>
                    </svg>

                    <span>Logout</span>
                </a>

            </nav>
        </div>
    </aside>


    <!-- Main Area -->
    <div class="main-area">

        <!-- Navbar -->
        <header class="navbar">

           <!-- Header -->
<a href="/" class="navbar-brand">
    <img th:src="@{/images/logo.png}" alt="Implant Finder" class="navbar-brand-logo">
</a>

            <svg class="breadcrumb-arrow"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor"
                 stroke-width="2.5"
                 aria-hidden="true">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M9 5l7 7-7 7"/>
            </svg>

            <span class="breadcrumb-current">
                Implant Data
            </span>

        </header>


        <!-- Main Content -->
        <main class="main-content">

            <!-- Page Heading -->
            <div class="page-heading">

                <h1 class="page-title">
                    Implant Data Management
                </h1>

               <div class="admin-actions">

   <a href="/admin/preview" class="view-user-button">

    <svg xmlns="http://www.w3.org/2000/svg"
         width="18"
         height="18"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round">

        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
        <circle cx="12" cy="12" r="3"/>

    </svg>

    <span>View as User</span>

</a>
</div>

            </div>


            <!-- Search and Add -->
            <div class="table-toolbar">

                <input type="text"
                       id="searchInput"
                       class="search-input"
                       oninput="filterModels()"
                       placeholder="Search models..."
                       aria-label="Search implant models">

                <a href="/admin/add-model"
                   class="add-model-button">
                    + Add
                </a>

            </div>


            <!-- Implant Data Table -->
            <div class="table-container">

                <table class="implant-table">

                    <thead class="table-header">
                        <tr>
                            <th>Image</th>
                            <th>Brand</th>
                            <th>Model</th>
                            <th>Material</th>
                            <th>Size</th>
                            <th class="actions-heading">Actions</th>
                        </tr>
                    </thead>

                    <tbody class="table-body">
                        <th:block th:each="m : ${models}">
                            <tr th:each="size : ${m.sizeList}" class="model-row">
                                <td class="image-cell">
                                    <div class="model-thumbnail">
                                        <img th:src="${m.imageUrl}"
                                             class="thumbnail-image"
                                             alt="Implant model thumbnail">
                                    </div>
                                </td>
                                <td class="brand-cell"
                                    th:text="${m.brand != null ? m.brand.brandName : '-'}"></td>
                                <td class="model-name-cell" th:text="${m.modelName}"></td>
                                <td class="material-cell"
                                    th:text="${m.material != null ? m.material.materialName : '-'}"></td>
                                <td class="size-cell" th:text="${size.displaySize}"></td>
                                <td class="actions-cell">
                                    <div class="action-buttons">
                                        <a th:href="@{'/admin/edit-model/' + ${m.modelId}}"
                                           class="icon-button edit-button"
                                           title="Edit"
                                           aria-label="Edit model">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                 stroke-width="2" stroke-linecap="round"
                                                 stroke-linejoin="round" aria-hidden="true">
                                                <path d="M15.232 5.232l3.536 3.536M9 13l6.768-6.768a2.5 2.5 0 113.536 3.536L12.536 16.536 8 18l1-5z"/>
                                            </svg>
                                        </a>
                                        <form th:action="@{'/admin/toggle-size-status/' + ${size.sizeId}}"
                                              method="post" class="status-form">
                                            <button type="submit" class="status-toggle"
                                                    th:title="${size.status == 'Visible' ? 'Visible (click to hide)' : 'Hidden (click to show)'}"
                                                    th:classappend="${size.status == 'Visible' ? ' status-visible' : ' status-hidden'}"
                                                    th:attr="aria-label=${size.status == 'Visible' ? 'Hide size' : 'Show size'}">
                                                <span class="status-toggle-knob"></span>
                                            </button>
                                        </form>
                                        <form th:action="@{'/admin/delete/' + ${m.modelId}}"
                                              method="post" class="delete-form">
                                            <button type="submit" class="icon-button delete-button"
                                                    onclick="return confirm('Delete model?')"
                                                    title="Delete model" aria-label="Delete model">
                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                     stroke-width="1.8" stroke-linecap="round"
                                                     stroke-linejoin="round" aria-hidden="true">
                                                    <path d="M6 7h12M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5"/>
                                                </svg>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(m.sizeList)}" class="model-row">
                                <td class="image-cell">
                                    <div class="model-thumbnail">
                                        <img th:src="${m.imageUrl}"
                                             class="thumbnail-image"
                                             alt="Implant model thumbnail">
                                    </div>
                                </td>
                                <td class="brand-cell"
                                    th:text="${m.brand != null ? m.brand.brandName : '-'}"></td>
                                <td class="model-name-cell" th:text="${m.modelName}"></td>
                                <td class="material-cell"
                                    th:text="${m.material != null ? m.material.materialName : '-'}"></td>
                                <td class="size-cell">-</td>
                                <td class="actions-cell">
                                    <div class="action-buttons">
                                        <a th:href="@{'/admin/edit-model/' + ${m.modelId}}"
                                           class="icon-button edit-button"
                                           title="Edit"
                                           aria-label="Edit model">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                 stroke-width="2" stroke-linecap="round"
                                                 stroke-linejoin="round" aria-hidden="true">
                                                <path d="M15.232 5.232l3.536 3.536M9 13l6.768-6.768a2.5 2.5 0 113.536 3.536L12.536 16.536 8 18l1-5z"/>
                                            </svg>
                                        </a>
                                        <form th:action="@{'/admin/toggle-status/' + ${m.modelId}}"
                                              method="post" class="status-form">
                                            <button type="submit" class="status-toggle"
                                                    th:title="${m.status == 'Visible' ? 'Visible (click to hide)' : 'Hidden (click to show)'}"
                                                    th:classappend="${m.status == 'Visible' ? ' status-visible' : ' status-hidden'}"
                                                    th:attr="aria-label=${m.status == 'Visible' ? 'Hide model' : 'Show model'}">
                                                <span class="status-toggle-knob"></span>
                                            </button>
                                        </form>
                                        <form th:action="@{'/admin/delete/' + ${m.modelId}}"
                                              method="post" class="delete-form">
                                            <button type="submit" class="icon-button delete-button"
                                                    onclick="return confirm('Delete model?')"
                                                    title="Delete model" aria-label="Delete model">
                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                     stroke-width="1.8" stroke-linecap="round"
                                                     stroke-linejoin="round" aria-hidden="true">
                                                    <path d="M6 7h12M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5"/>
                                                </svg>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </th:block>
                    </tbody>
                </table>

            </div>

            <div class="pagination-container">
                <span id="resultsSummary" class="results-summary" aria-live="polite"></span>
                <nav class="pagination" aria-label="Table pages">
                    <button type="button" id="previousPage" class="pagination-button">Previous</button>
                    <div id="pageNumbers" class="pagination-pages"></div>
                    <button type="button" id="nextPage" class="pagination-button">Next</button>
                </nav>
            </div>

        </main>
    </div>


    <!-- Search Models -->
    <script>
        const pageSize = 10;
        const modelRows = Array.from(document.querySelectorAll('.model-row'));
        const pageNumbers = document.getElementById('pageNumbers');
        const resultsSummary = document.getElementById('resultsSummary');
        const previousPage = document.getElementById('previousPage');
        const nextPage = document.getElementById('nextPage');
        let currentPage = 1;
        let filteredRows = modelRows;

        function renderPage() {
            const pageCount = Math.ceil(filteredRows.length / pageSize);
            currentPage = Math.min(currentPage, Math.max(pageCount, 1));

            modelRows.forEach(row => {
                row.style.display = 'none';
            });

            const startIndex = (currentPage - 1) * pageSize;
            filteredRows.slice(startIndex, startIndex + pageSize).forEach(row => {
                row.style.display = '';
            });

            resultsSummary.textContent = filteredRows.length === 0
                ? 'Showing 0 of 0 rows'
                : `Showing ${startIndex + 1}-${Math.min(startIndex + pageSize, filteredRows.length)} of ${filteredRows.length} rows`;

            pageNumbers.replaceChildren();
            const visiblePages = pageCount <= 6
                ? Array.from({ length: pageCount }, (_, index) => index + 1)
                : [1, 2, 3, 4, ...(currentPage > 4 && currentPage < pageCount ? [currentPage] : []), pageCount];

            visiblePages.forEach((page, index) => {
                if (index > 0 && page - visiblePages[index - 1] > 1) {
                    const ellipsis = document.createElement('span');
                    ellipsis.className = 'pagination-ellipsis';
                    ellipsis.textContent = '...';
                    ellipsis.setAttribute('aria-hidden', 'true');
                    pageNumbers.appendChild(ellipsis);
                }

                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'pagination-button';
                button.textContent = page;
                button.setAttribute('aria-label', `Page ${page}`);
                if (page === currentPage) {
                    button.classList.add('pagination-button-active');
                    button.setAttribute('aria-current', 'page');
                }
                button.addEventListener('click', () => {
                    currentPage = page;
                    renderPage();
                });
                pageNumbers.appendChild(button);
            });

            previousPage.disabled = currentPage <= 1;
            nextPage.disabled = currentPage >= pageCount;
        }

        function filterModels() {
            const query = document.getElementById('searchInput')
                .value.toLowerCase().trim();

            filteredRows = modelRows.filter(row => {
                const brandName = row.cells[1].textContent
                    .toLowerCase().trim();

                const modelName = row.cells[2].textContent
                    .toLowerCase().trim();

                return brandName.startsWith(query) || modelName.startsWith(query);
            });
            currentPage = 1;
            renderPage();
        }

        previousPage.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage -= 1;
                renderPage();
            }
        });

        nextPage.addEventListener('click', () => {
            if (currentPage < Math.ceil(filteredRows.length / pageSize)) {
                currentPage += 1;
                renderPage();
            }
        });

        renderPage();
    </script>


</body>
</html>
