<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Implant Data Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* Set the font used throughout the page */
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-[#f0f4f9] flex min-h-screen">

    <!-- Sidebar -->
    <div class="w-64 bg-[#0a192f] text-white p-6">
        <div class="space-y-8">

            <!-- Application logo and name -->
            <div class="flex items-center gap-3">
                <span class="text-2xl">🦷</span>
                <span class="text-xl font-bold tracking-tight">Implant</span>
            </div>

            <!-- Navigation links -->
            <nav class="space-y-2">
                <a href="/admin/data-management"
                   class="flex items-center gap-3 py-3 px-4 bg-[#2563eb] font-bold rounded-xl text-sm">
                    💾 Implant Data
                </a>

                <a href="/admin/profile"
                   class="flex items-center gap-3 py-3 px-4 text-slate-400 hover:bg-slate-800 rounded-xl text-sm font-semibold transition">
                    👤 Profile
                </a>

                <a href="/admin/logout"
                   class="flex items-center gap-3 py-3 px-4 text-slate-400 hover:bg-slate-800 hover:text-red-400 rounded-xl text-sm font-semibold transition">
                    🚪 Logout
                </a>
            </nav>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-8">

        <!-- Page title and admin information -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black text-slate-800">
                Implant Data Management
            </h1>

            <div class="flex items-center gap-4">

                <!-- Link to the public home page -->
                <a href="/"
                   class="px-4 py-2 bg-white text-slate-700 rounded-xl font-bold text-xs shadow-sm border border-slate-200">
                    View as user
                </a>

                <!-- Admin profile indicator -->
                <div class="flex items-center gap-3 bg-white p-2 rounded-xl shadow-sm border border-slate-200">
                    <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center font-bold text-blue-600">
                        A
                    </div>
                    <span class="text-xs font-bold text-slate-800">Admin</span>
                </div>
            </div>
        </div>

                <!-- Search bar and Add button (right aligned) -->
        <div class="flex justify-end items-center gap-4 mb-6">

            <!-- Search bar:
                 Calls filterModels() whenever the input changes. -->
            <input type="text"
                   id="searchInput"
                   oninput="filterModels()"
                   placeholder="Search models..."
                   class="px-4 py-2 bg-white rounded-xl text-sm border-none shadow-sm outline-none">

            <!-- Navigate to the Add Model page -->
            <a href="/admin/add-model"
               class="px-5 py-2 bg-[#2563eb] hover:bg-blue-700 text-white font-bold rounded-xl text-sm transition shadow-sm">
                + Add
            </a>
        </div>

        <!-- Table displaying implant model data -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <table class="w-full text-left border-collapse">

                <!-- Table headings -->
                <thead class="bg-slate-50 border-b border-slate-200 text-slate-400 text-xs uppercase font-extrabold">
                    <tr>
                        <th class="p-4">Image</th>
                        <th class="p-4">Brand</th>
                        <th class="p-4">Model</th>
                        <th class="p-4">Material</th>
                        <th class="p-4">Size</th>
                        <th class="p-4 text-right">Actions</th>
                    </tr>
                </thead>

                <tbody class="divide-y divide-slate-100 text-sm font-semibold text-slate-700">

                    <!-- Thymeleaf generates one row for each model.
                         The model-row class allows JavaScript to find each row. -->
                    <tr th:each="m : ${models}" class="model-row">

                        <!-- Model image -->
                        <td class="p-4">
                            <div class="w-12 h-12 bg-black rounded-lg p-1 flex items-center justify-center">
                                <img th:src="${m.imageUrl}"
                                     class="max-h-10 object-contain"
                                     alt="Thumbnail">
                            </div>
                        </td>

                        <!-- Brand name -->
                        <td class="p-4 font-bold text-slate-900"
                            th:text="${m.brand.brandName}">
                        </td>

                        <!-- Model name -->
                        <td class="p-4"
                            th:text="${m.modelName}">
                        </td>

                        <!-- Material -->
                        <td class="p-4 text-slate-500"
                            th:text="${m.material}">
                        </td>

                        <!-- Available sizes:
                             The raw size text is stored in data-sizes,
                             then JavaScript at the bottom turns it into a summary. -->
                        <td class="p-4 size-cell"
                            th:attr="data-sizes=${m.sizes}">
                        </td>

                        <!-- Actions: Edit, toggle status, and Delete -->
                        <td class="p-4 text-right">
                            <div class="flex items-center justify-end gap-3">

                                <!-- Edit button: opens the selected model's edit page -->
                                <a th:href="@{'/admin/edit-model/' + ${m.modelId}}"
                                   title="Edit"
                                   class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-blue-600 hover:bg-blue-50 transition">

                                    <!-- Pencil SVG icon -->
                                    <svg xmlns="http://www.w3.org/2000/svg"
                                         class="w-5 h-5"
                                         fill="none"
                                         viewBox="0 0 24 24"
                                         stroke="currentColor"
                                         stroke-width="2">
                                        <path stroke-linecap="round"
                                              stroke-linejoin="round"
                                              d="M15.232 5.232l3.536 3.536M9 13l6.768-6.768a2.5 2.5 0 113.536 3.536L12.536 16.536 8 18l1-5z" />
                                    </svg>
                                </a>

                                <!-- Toggle button: submits a request to change model status -->
                                <form th:action="@{'/admin/toggle-status/' + ${m.modelId}}"
                                      method="post">

                                    <!-- Button color and position depend on the current status -->
                                    <button type="submit"
                                            th:class="${m.status == 'Visible' ? 'w-10 h-6 bg-yellow-400 rounded-full p-1 flex items-center justify-end' : 'w-10 h-6 bg-slate-300 rounded-full p-1 flex items-center justify-start'}">
                                        <div class="w-4 h-4 bg-white rounded-full shadow-sm"></div>
                                    </button>
                                </form>

                                <!-- Delete button: asks for confirmation before deleting -->
                                <form th:action="@{'/admin/delete/' + ${m.modelId}}"
                                      method="post">

                                    <button type="submit"
                                            onclick="return confirm('Delete model?')"
                                            title="Delete model"
                                            aria-label="Delete model"
                                            class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-red-600 hover:bg-red-50 transition">

                                        <!-- Professional outline trash-can SVG icon -->
                                        <svg xmlns="http://www.w3.org/2000/svg"
                                             class="w-5 h-5"
                                             fill="none"
                                             viewBox="0 0 24 24"
                                             stroke="currentColor"
                                             stroke-width="1.8">

                                            <path stroke-linecap="round"
                                                  stroke-linejoin="round"
                                                  d="M6 7h12M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5" />
                                        </svg>

                                    </button>
                                </form>

                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>



<script>
    function filterModels() {
        const query = document.getElementById('searchInput')
            .value.toLowerCase().trim();

        document.querySelectorAll('.model-row').forEach(row => {
            // Read only the brand and model names.
            const brandName = row.cells[1].textContent
                .toLowerCase().trim();

            const modelName = row.cells[2].textContent
                .toLowerCase().trim();

            // Match only if the brand OR model starts with the query.
            const matches =
                brandName.startsWith(query) ||
                modelName.startsWith(query);

            row.style.display = matches ? '' : 'none';
        });
    }
</script>

<!-- Size summary + expandable list grouped by diameter -->
<script>
    // Split "Ø 3.6 x 11 mm, ..." into groups by diameter
    function parseSizes(raw) {
        const groups = {};
        const re = /([\d.]+)\s*[x×]\s*([\d.]+)/gi;
        let m, count = 0;
        while ((m = re.exec(raw || '')) !== null) {
            const d = parseFloat(m[1]), l = parseFloat(m[2]);
            groups[d] = groups[d] || new Set();
            groups[d].add(l);
            count++;
        }
        const diameters = Object.keys(groups).map(Number).sort((a, b) => a - b);
        const lengths = [...new Set(diameters.flatMap(d => [...groups[d]]))].sort((a, b) => a - b);
        return { groups, diameters, lengths, count };
    }

    // 3 -> "3.0", 3.75 -> "3.75"
    function fmt(n) { return Number.isInteger(n) ? n.toFixed(1) : String(n); }

    document.querySelectorAll('.size-cell').forEach(function (cell) {
        const raw = cell.dataset.sizes || '';
        const s = parseSizes(raw);

        // If the format can't be read, show the original text
        if (s.count === 0) { cell.textContent = raw; return; }

        const dMin = s.diameters[0], dMax = s.diameters[s.diameters.length - 1];
        const lMin = s.lengths[0],   lMax = s.lengths[s.lengths.length - 1];
        const dText = dMin === dMax ? `Ø ${fmt(dMin)} mm` : `Ø ${fmt(dMin)} – ${fmt(dMax)} mm`;
        const lText = lMin === lMax ? `L ${lMin} mm` : `L ${lMin} – ${lMax} mm`;

        // One row per diameter, chips = lengths
        const rows = s.diameters.map(d => {
            const lens = [...s.groups[d]].sort((a, b) => a - b)
                .map(l => `<span class="min-w-[32px] h-8 px-2 flex items-center justify-center bg-slate-100 text-slate-700 rounded-lg text-xs font-bold">${l}</span>`)
                .join('');
            return `<div class="flex items-center gap-1.5">
                        <span class="w-16 h-8 flex items-center justify-center bg-blue-50 text-blue-700 rounded-lg text-xs font-extrabold">Ø ${fmt(d)}</span>
                        ${lens}
                    </div>`;
        }).join('');

        cell.innerHTML = `
            <div class="flex flex-wrap items-center gap-3">
                <span class="font-extrabold text-slate-900">${dText}</span>
                <span class="text-slate-400 font-semibold">${lText}</span>
                <span class="px-2 py-0.5 bg-slate-100 text-slate-600 rounded-md text-xs font-bold">${s.count} sizes</span>
                <button type="button" class="toggle-btn px-3 py-1 border border-slate-200 hover:bg-slate-50 rounded-lg text-xs font-bold text-slate-600 transition">View all ▾</button>
            </div>
            <div class="size-detail hidden mt-3 p-3 bg-white border border-slate-100 rounded-xl space-y-1.5">
                ${rows}
                <p class="text-xs text-slate-400 pt-1">Numbers = length (mm)</p>
            </div>
        `;

        // Expand / collapse
        const btn = cell.querySelector('.toggle-btn');
        const box = cell.querySelector('.size-detail');
        btn.addEventListener('click', function () {
            box.classList.toggle('hidden');
            btn.textContent = box.classList.contains('hidden') ? 'View all ▾' : 'Hide ▴';
        });
    });
</script>

</body>
</html>
