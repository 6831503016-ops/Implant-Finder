<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Implant Data Management</title>
    <link rel="stylesheet" th:href="@{/css/admin-notifications.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/data-management.css}">
</head>
<body>
<div th:replace="~{admin/fragment :: notifications}"></div>
<div class="admin-layout">

    <!-- ===== เมนูข้าง ===== -->
    <aside class="sidebar">

        <a th:href="@{/}" class="site-logo" aria-label="Implant Finder home">
            <img th:src="@{/images/logo.png}" alt="Implant Finder">
        </a>

        <nav class="side-nav">
            <a th:href="@{/admin/profile}" class="side-link">
                <span class="side-icon">
                    <img class="side-avatar"
                         th:src="${session.admin != null and !#strings.isEmpty(session.admin.avatarLink)} ? ${session.admin.avatarLink} : 'https://api.dicebear.com/7.x/personas/svg?seed=Admin1&backgroundColor=efe9df'"
                         alt="Admin avatar">
                </span>
                <span>Admin</span>
            </a>

            <a th:href="@{/admin/data-management}" class="side-link is-active">
                <span class="side-icon">
                    <svg width="28" height="35" viewBox="0 0 24 30" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <ellipse cx="12" cy="5" rx="10" ry="4"/>
                        <path d="M2 5v20c0 2.2 4.5 4 10 4s10-1.8 10-4V5"/>
                        <path d="M2 15c0 2.2 4.5 4 10 4s10-1.8 10-4"/>
                    </svg>
                </span>
                <span>Implant Data</span>
            </a>

            <a th:href="@{/admin/logout}" class="side-link">
                <span class="side-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 3H4v18h5"/>
                        <path d="M16 7l5 5-5 5"/>
                        <path d="M21 12H9"/>
                    </svg>
                </span>
                <span>Logout</span>
            </a>
        </nav>
    </aside>

    <div class="admin-main">
        <div class="admin-band"></div>

        <main class="admin-content">

            <!-- ===== แถว 1: Breadcrumb + ปุ่มด้านขวา ===== -->
            <div class="dm-top">
                <nav class="page-nav" aria-label="Breadcrumb">
                    <a th:href="@{/}" class="back-btn" title="Back to Home" aria-label="Back to Home">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m0 0l6-6m-6 6l6 6"/>
                        </svg>
                    </a>
                    <div class="crumbs">
                        <a th:href="@{/}">Home</a>
                        <svg class="chev" viewBox="0 0 11 16" fill="none" stroke="currentColor" stroke-width="2.4"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M3 2.5 8.5 8 3 13.5"/>
                        </svg>
                        <span aria-current="page">Implant Data</span>
                    </div>
                </nav>

                <div class="dm-top-actions">
                    <a th:href="@{/admin/add-model}" class="btn-primary dm-add-btn">+ Add</a>
                    <a th:href="@{/admin/preview}" class="btn-outline dm-view-btn">View as User</a>
                </div>
            </div>

            <!-- ===== แถว 2: หัวข้อ + ค้นหา ===== -->
            <div class="dm-heading">
                <h1 class="dm-title">Implant Data Management</h1>

                <div class="dm-search">
                    <input type="text" id="searchInput"
                           placeholder="Search..."
                           aria-label="Search implant models"
                           autocomplete="off">

                    <svg class="dm-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7.5"/>
                        <path d="m20 20-3.6-3.6"/>
                    </svg>
                </div>
            </div>

            <!-- ===== ตาราง ===== -->
            <div class="dm-card">
                <table class="dm-table">
                    <colgroup>
                        <col style="width: 97px">
                        <col style="width: 110px">
                        <col style="width: 216px">
                        <col style="width: 228px">
                        <col style="width: 335px">
                        <col>
                    </colgroup>

                    <thead>
                        <tr>
                            <th class="col-image">Image</th>
                            <th>Brand</th>
                            <th>Model</th>
                            <th>Material</th>
                            <th>Size</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="m : ${models}" class="model-row">

                            <!-- รูป -->
                            <td class="col-image">
                                <div class="dm-thumb">
                                    <img th:src="${m.imageUrl}" alt="Implant model thumbnail">
                                </div>
                            </td>

                            <td class="dm-text brand-cell"
                                th:text="${m.brand != null ? m.brand.brandName : '-'}"></td>

                            <td class="dm-text model-cell"
                                th:text="${m.modelName}"></td>

                            <td class="dm-text"
                                th:text="${m.material != null ? m.material.materialName : '-'}"></td>

                            <!-- ขนาด -->
                            <td class="size-cell">
                                <th:block th:if="${#lists.isEmpty(m.sizeList)}">
                                    <span class="dm-text">-</span>
                                </th:block>

                                <th:block th:unless="${#lists.isEmpty(m.sizeList)}"
                                          th:with="ds=${#lists.sort(m.sizeList.![diameterMm])},
                                                   ls=${#lists.sort(m.sizeList.![lengthMm])},
                                                   dMin=${#numbers.formatDecimal(ds[0], 1, 'NONE', 1, 'POINT')},
                                                   dMax=${#numbers.formatDecimal(ds[ds.size() - 1], 1, 'NONE', 1, 'POINT')},
                                                   lMin=${ls[0].stripTrailingZeros().toPlainString()},
                                                   lMax=${ls[ls.size() - 1].stripTrailingZeros().toPlainString()}">

                                    <div class="size-line">
                                        <span class="size-range">
                                            <span class="size-d"
                                                  th:text="${dMin == dMax ? 'Ø ' + dMin + ' mm' : 'Ø ' + dMin + ' – ' + dMax + ' mm'}"></span>

                                            <span class="size-l"
                                                  th:text="${lMin == lMax ? 'L ' + lMin + ' mm' : 'L ' + lMin + ' – ' + lMax + ' mm'}"></span>
                                        </span>

                                        <span class="size-count"
                                              th:text="${m.sizeList.size() + ' sizes'}"></span>
                                    </div>

                                    <details class="size-dropdown">
                                        <summary>View all <span class="caret">▾</span></summary>

                                        <ul class="size-list">
                                            <li th:each="size : ${m.sizeList}">
                                                <span th:text="${size.displaySize}"
                                                      th:classappend="${size.status == 'Hidden'} ? ' is-hidden' : ''"></span>

                                                <form th:action="@{'/admin/toggle-size-status/' + ${size.sizeId}}" method="post">
                                                    <button type="submit" class="switch switch-sm"
                                                            th:classappend="${size.status == 'Hidden'} ? ' is-off' : ''"
                                                            th:title="${size.status == 'Hidden'} ? 'Hidden (click to show)' : 'Visible (click to hide)'"
                                                            th:attr="aria-label=${size.status == 'Hidden' ? 'Show size' : 'Hide size'}">
                                                        <span class="switch-knob"></span>
                                                    </button>
                                                </form>
                                            </li>
                                        </ul>
                                    </details>
                                </th:block>
                            </td>

                            <!-- Actions -->
                            <td>
                                <div class="dm-actions">

                                    <a th:href="@{'/admin/edit-model/' + ${m.modelId}}"
                                       class="icon-edit"
                                       title="Edit"
                                       aria-label="Edit model">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>
                                        </svg>
                                    </a>

                                    <form th:action="@{'/admin/toggle-status/' + ${m.modelId}}" method="post">
                                        <button type="submit" class="switch"
                                                th:classappend="${m.status == 'Hidden'} ? ' is-off' : ''"
                                                th:title="${m.status == 'Hidden'} ? 'Hidden (click to show)' : 'Visible (click to hide)'"
                                                th:attr="aria-label=${m.status == 'Hidden' ? 'Show model' : 'Hide model'}">
                                            <span class="switch-knob"></span>
                                        </button>
                                    </form>

                                    <form th:action="@{'/admin/delete/' + ${m.modelId}}" method="post">
                                        <button type="button"
                                                class="icon-delete"
                                                title="Delete model"
                                                aria-label="Delete model">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                                <path d="M5 7h14M10 7V4h4v3m-7 0 1 13h8l1-13M10 11v6m4-6v6"/>
                                            </svg>
                                        </button>
                                    </form>

                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <p id="noResults" class="dm-empty" hidden>No implant models found.</p>

                <!-- ===== Pagination ===== -->
                <div class="dm-footer">
                    <nav class="dm-pagination" aria-label="Pagination">
                        <button type="button" id="previousPage" class="page-arrow" aria-label="Previous page">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                                 stroke-linecap="round" aria-hidden="true">
                                <path d="M19 12H5m0 0 5-5m-5 5 5 5"/>
                            </svg>
                        </button>

                        <div id="pageNumbers" class="page-numbers" aria-live="polite"></div>

                        <button type="button" id="nextPage" class="page-arrow" aria-label="Next page">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                                 stroke-linecap="round" aria-hidden="true">
                                <path d="M5 12h14m0 0-5-5m5 5-5 5"/>
                            </svg>
                        </button>
                    </nav>
                </div>
            </div>
        </main>
    </div>
</div>

<dialog id="deleteModelDialog" class="dm-delete-dialog" aria-labelledby="deleteModelTitle"> <!-- หน้าต้่างป๊อบอัปยืนยันลบ -->
    <div class="dm-delete-content">
        <div class="dm-delete-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 7h14M10 7V4h4v3m-7 0 1 13h8l1-13M10 11v6m4-6v6"/>
            </svg>
        </div>
        <h2 id="deleteModelTitle">Delete model?</h2>
        <p class="dm-delete-note">Only this model and its sizes will be deleted. If it is the last model of its brand, the brand is removed too.</p>
        <div class="dm-delete-actions">
            <button type="button" class="dm-delete-cancel" autofocus>Cancel</button>
            <button type="button" id="confirmDeleteModel" class="dm-delete-confirm">Delete</button>
        </div>
    </div>
</dialog>

<!-- ===== JavaScript ===== -->
<script th:src="@{/js/model-search.js}"></script>
<script th:src="@{/js/data-management.js}"></script>
<script th:src="@{/js/admin-notifications.js}"></script>
</body>
</html>
