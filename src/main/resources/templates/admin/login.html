<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Admin Login</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
          rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" th:href="@{/css/admin-login.css}">
</head>

<body>

<!-- Back Arrow -->
<a href="/"
   title="Back to Home"
   class="back-button">

    <svg xmlns="http://www.w3.org/2000/svg"
         width="20"
         height="20"
         fill="none"
         viewBox="0 0 24 24"
         stroke="currentColor"
         stroke-width="1.8">

        <path stroke-linecap="round"
              stroke-linejoin="round"
              d="M19 12H5m0 0l6-6m-6 6l6 6"/>
    </svg>
</a>

<!-- Main Layout -->
<div class="login-container">

    <!-- Left Section -->
    <section class="login-left">

        <!-- Implant Image -->
        <div class="implant-image-container">

            <img
                src="https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?w=800&auto=format&fit=crop"
                class="implant-image"
                alt="Dental Implant">
        </div>

        <!-- Footer -->
        <p class="left-footer">
            Dental Implant Database Management System
        </p>

    </section>

    <!-- Right Section -->
    <section class="login-right">

        <div class="login-content">

            <!-- Heading -->
            <div class="login-header">

                <div class="brand">
                    <span class="brand-icon">🦷</span>
                    <span class="brand-name">Implant</span>

                </div>

                <h1>Admin Login</h1>

            </div>

            <!-- Login Form -->
            <form th:action="@{/admin/login}"
                  method="post"
                  class="login-form">

                <!-- Email Field -->
                <div class="input-group">

                    <span class="input-icon">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             width="22"
                             height="22"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="1.8"
                             stroke-linecap="round"
                             stroke-linejoin="round"
                             aria-hidden="true">

                            <rect x="3" y="5" width="18" height="14" rx="2"/>
                            <path d="M3 7l9 6 9-6"/>

                        </svg>

                    </span>

                    <input
                        type="text"
                        name="email"
                        required
                        placeholder="admin@implant.com"
                        aria-label="Email">

                </div>

                <!-- Password Field -->
                <div class="input-group">

                    <span class="input-icon">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             width="22"
                             height="22"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="1.8"
                             stroke-linecap="round"
                             stroke-linejoin="round"
                             aria-hidden="true">

                            <rect x="3" y="11" width="18" height="11" rx="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>

                        </svg>

                    </span>

                    <input
                        type="password"
                        id="passInput"
                        name="password"
                        required
                        placeholder="Password"
                        aria-label="Password">

                    <!-- Show / Hide Password -->
                    <button
                        type="button"
                        id="togglePassButton"
                        class="toggle-password"
                        aria-label="Show password"
                        aria-pressed="false">

                        <svg id="eyeIcon"
                             xmlns="http://www.w3.org/2000/svg"
                             width="22"
                             height="22"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="1.8"
                             stroke-linecap="round"
                             stroke-linejoin="round"
                             aria-hidden="true">

                            <path d="M3 3l18 18"/>
                            <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                            <path d="M9.9 5.2A11.5 11.5 0 0 1 12 5c6.4 0 10 7 10 7a16.7 16.7 0 0 1-4 4.8"/>
                            <path d="M6.6 6.6C3.6 8.4 2 12 2 12s3.6 7 10 7a10.9 10.9 0 0 0 3.4-.5"/>

                        </svg>

                    </button>

                </div>

                <!-- Login Button -->
                <button type="submit" class="login-button">
                    Login
                </button>

            </form>

        </div>

    </section>

</div>

<!-- External JavaScript -->
<script>
    const passwordInput = document.getElementById('passInput');
    const toggleButton = document.getElementById('togglePassButton');
    const eyeIcon = document.getElementById('eyeIcon');

    const showPasswordIcon = `
        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
        <circle cx="12" cy="12" r="3"/>
    `;

    const hidePasswordIcon = `
        <path d="M3 3l18 18"/>
        <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
        <path d="M9.9 5.2A11.5 11.5 0 0 1 12 5c6.4 0 10 7 10 7a16.7 16.7 0 0 1-4 4.8"/>
        <path d="M6.6 6.6C3.6 8.4 2 12 2 12s3.6 7 10 7a10.9 10.9 0 0 0 3.4-.5"/>
    `;

    toggleButton.addEventListener('click', function () {

        const isPasswordHidden = passwordInput.type === 'password';

        passwordInput.type = isPasswordHidden ? 'text' : 'password';

        toggleButton.setAttribute(
            'aria-label',
            isPasswordHidden ? 'Hide password' : 'Show password'
        );

        toggleButton.setAttribute(
            'aria-pressed',
            String(isPasswordHidden)
        );

        eyeIcon.innerHTML = isPasswordHidden
            ? showPasswordIcon
            : hidePasswordIcon;

    });
</script>

</body>
</html>
