<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="login-page">

    <!-- ปุ่มย้อนกลับ -->
    <a th:href="@{/}" class="back-btn login-back" title="Back to Home" aria-label="Back to Home">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m0 0l6-6m-6 6l6 6"/>
        </svg>
    </a>

    <div class="login-layout">

        <!-- ซ้าย: รูปภาพ -->
        <section class="login-photo" aria-hidden="true"></section>

        <!-- ขวา: ฟอร์ม -->
        <section class="login-panel">
            <div class="login-box">

                <div class="site-logo login-logo">
                    <img th:src="@{/images/logo.png}" alt="Implant Finder">
                </div>

                <h1 class="login-title">Admin <span>Login</span></h1>

                <p th:if="${param.error}" class="login-error">Incorrect email or password.</p>

                <form th:action="@{/admin/login}" method="post" class="login-form">

                    <div class="login-field">
                        <svg class="login-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="5" width="18" height="14" rx="2"/>
                            <path d="M3 7l9 6 9-6"/>
                        </svg>
                        <input type="text" name="email" required placeholder="admin@implant.com"
                               aria-label="Email or username" class="login-input login-input-email">
                    </div>

                    <div class="login-field">
                        <svg class="login-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="4" y="11" width="16" height="10" rx="2"/>
                            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                        </svg>
                        <input type="password" id="passInput" name="password" required placeholder="Password"
                               aria-label="Password" class="login-input">
                        <button type="button" id="togglePassButton" class="toggle-password"
                                aria-label="Show password" aria-pressed="false">
                            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M3 3l18 18"/>
                                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                                <path d="M9.9 5.2A11.5 11.5 0 0 1 12 5c6.4 0 10 7 10 7a16.7 16.7 0 0 1-4 4.8"/>
                                <path d="M6.6 6.6C3.6 8.4 2 12 2 12s3.6 7 10 7a10.9 10.9 0 0 0 3.4-.5"/>
                            </svg>
                        </button>
                    </div>

                    <button type="submit" class="login-button">Login</button>
                </form>
            </div>
        </section>
    </div>

    <script>
        const passwordInput = document.getElementById('passInput');
        const toggleButton = document.getElementById('togglePassButton');
        const eyeIcon = document.getElementById('eyeIcon');

        const showIcon = '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
        const hideIcon = '<path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>'
            + '<path d="M9.9 5.2A11.5 11.5 0 0 1 12 5c6.4 0 10 7 10 7a16.7 16.7 0 0 1-4 4.8"/>'
            + '<path d="M6.6 6.6C3.6 8.4 2 12 2 12s3.6 7 10 7a10.9 10.9 0 0 0 3.4-.5"/>';

        toggleButton.addEventListener('click', () => {
            const show = passwordInput.type === 'password';
            passwordInput.type = show ? 'text' : 'password';
            toggleButton.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            toggleButton.setAttribute('aria-pressed', String(show));
            eyeIcon.innerHTML = show ? showIcon : hideIcon;
        });
    </script>
</body>
</html>
