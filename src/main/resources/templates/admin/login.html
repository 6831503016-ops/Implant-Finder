
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-slate-100 to-blue-100/60 min-h-screen flex items-center justify-center p-4">

<!-- Back Arrow: Top-Left Corner -->
<a href="/"
   title="Back to Home"
   class="fixed top-6 left-6 z-50 w-12 h-12 bg-white rounded-2xl shadow-md flex items-center justify-center text-slate-700 hover:bg-slate-50 hover:text-blue-600 hover:-translate-x-0.5 hover:shadow-lg transition">

    <svg xmlns="http://www.w3.org/2000/svg"
         class="w-5 h-5"
         fill="none"
         viewBox="0 0 24 24"
         stroke="currentColor"
         stroke-width="1.8">

        <path stroke-linecap="round"
              stroke-linejoin="round"
              d="M19 12H5m0 0l6-6m-6 6l6 6" />
    </svg>
</a>

    <div class="bg-white rounded-[2rem] shadow-2xl shadow-slate-900/10 w-full max-w-6xl min-h-[680px] overflow-hidden grid grid-cols-1 md:grid-cols-2">

        <!-- ฝั่งซ้าย -->
        <div class="bg-gradient-to-br from-[#081c3d] via-[#051329] to-[#030b1a] p-12 flex flex-col justify-between relative overflow-hidden text-white">
            <!-- แสงตกแต่ง -->
            <div class="absolute -top-24 -left-24 w-80 h-80 bg-blue-600/25 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-28 -right-24 w-80 h-80 bg-teal-400/10 rounded-full blur-3xl"></div>

            <div class="relative z-10">
                <span class="text-5xl">🦷</span>
            </div>

            <div class="relative z-10 my-auto text-center py-12">
                <img src="https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?w=800&auto=format&fit=crop"
                     class="w-72 h-72 object-cover rounded-full mx-auto border-[6px] border-blue-500/30 ring-8 ring-blue-500/10 shadow-2xl shadow-blue-900/60"
                     alt="3D Implant">
            </div>

            <p class="text-sm tracking-wide text-slate-400 relative z-10 text-center">
                Dental Implant Database Management System
            </p>
        </div>

        <!-- ฝั่งขวา -->
        <div class="p-12 md:p-16 flex flex-col justify-center">

            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center gap-2 mb-3">
                    <span class="text-3xl">🦷</span>
                    <span class="text-3xl font-black text-slate-900">Implant</span>
                </div>

                <h2 class="text-5xl font-black text-slate-900">
                    Admin Login
                </h2>
                <p class="text-slate-500 mt-3 text-base">Sign in to manage your data</p>
            </div>

            <form th:action="@{/admin/login}" method="post" class="space-y-5">

                <!-- Email field -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-5 flex items-center text-slate-400">
                        <svg xmlns="http://www.w3.org/2000/svg"
                             width="22" height="22" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round"
                             aria-hidden="true">
                            <rect x="3" y="11" width="18" height="11" rx="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </span>

                    <input type="text"
                           name="email"
                           required
                           placeholder="admin@implant.com"
                           class="w-full pl-14 pr-5 py-5 bg-slate-50 border border-slate-200 rounded-2xl text-base outline-none transition focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/15">
                </div>

                <!-- Password field -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-5 flex items-center text-slate-400">
                        <svg xmlns="http://www.w3.org/2000/svg"
                             width="22" height="22" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round"
                             aria-hidden="true">
                            <rect x="3" y="11" width="18" height="11" rx="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </span>

                    <input type="password"
                           id="passInput"
                           name="password"
                           required
                           placeholder="Password"
                           class="w-full pl-14 pr-14 py-5 bg-slate-50 border border-slate-200 rounded-2xl text-base outline-none transition focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/15">

                    <!-- Toggle password visibility -->
                    <button type="button"
                            onclick="togglePass()"
                            class="absolute inset-y-0 right-0 pr-5 flex items-center text-slate-400 hover:text-blue-600 transition"
                            aria-label="Show password"
                            id="togglePassButton">

                        <svg id="eyeIcon"
                             xmlns="http://www.w3.org/2000/svg"
                             width="22" height="22"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="1.8"
                             stroke-linecap="round"
                             stroke-linejoin="round"
                             aria-hidden="true">

                            <!-- Initially closed eye: password is hidden -->
                            <path d="M3 3l18 18"/>
                            <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                            <path d="M9.9 5.2A11.5 11.5 0 0 1 12 5c6.4 0 10 7 10 7a16.7 16.7 0 0 1-4 4.8"/>
                            <path d="M6.6 6.6C3.6 8.4 2 12 2 12s3.6 7 10 7a10.9 10.9 0 0 0 3.4-.5"/>
                        </svg>
                    </button>
                </div>

                <!-- Login button -->
                <button type="submit"
                        class="w-full py-5 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 text-white text-lg font-extrabold rounded-2xl transition-all shadow-lg shadow-blue-600/30 hover:shadow-xl hover:shadow-blue-600/40 hover:-translate-y-0.5 active:translate-y-0">
                    Login
                </button>

            </form>
        </div>
    </div>

    <!-- Show / Hide Password Logic -->
    <script>
        function togglePass() {
            const password = document.getElementById('passInput');
            const button = document.getElementById('togglePassButton');
            const icon = document.getElementById('eyeIcon');

            if (password.type === 'password') {
                // Show password and display an open eye
                password.type = 'text';

                button.setAttribute('aria-label', 'Hide password');

                icon.innerHTML = `
                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
                    <circle cx="12" cy="12" r="3"/>
                `;

            } else {
                // Hide password and display a crossed-out eye
                password.type = 'password';

                button.setAttribute('aria-label', 'Show password');

                icon.innerHTML = `
                    <path d="M3 3l18 18"/>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                    <path d="M9.9 5.2A11.5 11.5 0 0 1 12 5c6.4 0 10 7 10 7a16.7 16.7 0 0 1-4 4.8"/>
                    <path d="M6.6 6.6C3.6 8.4 2 12 2 12s3.6 7 10 7a10.9 10.9 0 0 0 3.4-.5"/>
                `;
            }
        }
    </script>

</body>
</html>
