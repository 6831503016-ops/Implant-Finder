<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Model Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#f4f7fc] min-h-screen">
    <nav class="px-8 py-4 bg-[#0a192f] text-white">
        <a href="/" class="font-bold text-lg flex items-center gap-2"><span>🦷</span> Implant</a>
    </nav>

    <div class="max-w-5xl mx-auto px-6 py-8">
        <a th:href="@{'/brand/' + ${implant.brand.brandId}}" class="inline-flex items-center gap-2 text-slate-600 font-bold mb-6 hover:text-blue-600">← Back</a>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
            <div class="bg-black rounded-3xl p-8 flex items-center justify-center shadow-md h-96">
                <img th:src="${implant.imageUrl}" class="max-h-80 object-contain" alt="Implant Detail">
            </div>

            <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-100">
                <div class="flex items-center gap-3 mb-2">
                    <span class="font-bold text-blue-900 text-lg uppercase" th:text="${implant.brand.brandName}"></span>
                </div>
                <h1 class="text-3xl font-extrabold text-[#0b2545] mb-6" th:text="${implant.modelName}"></h1>

                <div class="space-y-2 mb-8 text-sm">
                    <div class="flex justify-between p-2.5 bg-slate-50 rounded-lg"><span class="text-slate-400 font-medium">Brand</span><span class="font-bold text-slate-800" th:text="${implant.brand.brandName}"></span></div>
                    <div class="flex justify-between p-2.5 bg-white rounded-lg"><span class="text-slate-400 font-medium">Model</span><span class="font-bold text-slate-800" th:text="${implant.modelName}"></span></div>
                    <div class="flex justify-between p-2.5 bg-slate-50 rounded-lg"><span class="text-slate-400 font-medium">Material</span><span class="font-bold text-slate-800" th:text="${implant.material}"></span></div>
                    <div class="flex justify-between p-2.5 bg-white rounded-lg"><span class="text-slate-400 font-medium">Type</span><span class="font-bold text-slate-800" th:text="${implant.type}"></span></div>
                    <div class="flex justify-between p-2.5 bg-slate-50 rounded-lg"><span class="text-slate-400 font-medium">Surface</span><span class="font-bold text-slate-800" th:text="${implant.surfaceTreatment}"></span></div>
                    <div class="flex justify-between p-2.5 bg-white rounded-lg"><span class="text-slate-400 font-medium">Connection</span><span class="font-bold text-slate-800" th:text="${implant.connectionType}"></span></div>
                    <div class="flex justify-between p-2.5 bg-slate-50 rounded-lg"><span class="text-slate-400 font-medium">Country</span><span class="font-bold text-slate-800" th:text="${implant.country}"></span></div>
                </div>

                <div class="mb-6">
                    <h3 class="font-bold text-slate-900 mb-3 text-sm">Diameter</h3>
                    <div class="flex gap-2">
                        <button class="px-4 py-2 bg-[#2563eb] text-white rounded-xl text-xs font-bold shadow-sm">3.5 mm</button>
                        <button class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-semibold hover:bg-slate-200">4.0 mm</button>
                        <button class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-semibold hover:bg-slate-200">4.5 mm</button>
                        <button class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-semibold hover:bg-slate-200">5.0 mm</button>
                    </div>
                </div>

                <div>
                    <h3 class="font-bold text-slate-900 mb-3 text-sm">Length</h3>
                    <div class="flex gap-2">
                        <button class="px-4 py-2 bg-[#2563eb] text-white rounded-xl text-xs font-bold shadow-sm">8.5 mm</button>
                        <button class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-semibold hover:bg-slate-200">10 mm</button>
                        <button class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-semibold hover:bg-slate-200">11.5 mm</button>
                        <button class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-semibold hover:bg-slate-200">13 mm</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
