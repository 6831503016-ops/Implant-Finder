<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Model Detail</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/model-detail.css}">
</head>

<body class="page-body">

    <!-- Breadcrumb Header -->
    <header class="breadcrumb-header">

        <!-- Home -->
        <a th:href="@{/}" class="brand-home-link">
            <span class="icon">🦷</span>
            Implant
        </a>

        <!-- Arrow -->
        <svg class="breadcrumb-arrow"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor"
             stroke-width="2.5">
            <path stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M9 5l7 7-7 7"/>
        </svg>

        <!-- Brand -->
        <a th:href="@{'/brand/' + ${implant.brand.brandId}}"
           class="breadcrumb-link"
           th:text="${implant.brand.brandName}">
            Brand
        </a>

        <!-- Arrow -->
        <svg class="breadcrumb-arrow"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor"
             stroke-width="2.5">
            <path stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M9 5l7 7-7 7"/>
        </svg>

        <!-- Model -->
        <a th:href="@{'/model/' + ${implant.modelId}}"
           class="breadcrumb-link"
           th:text="${implant.modelName}">
            Model
        </a>

        <!-- Selected Size -->
        <span id="breadcrumbSizeWrapper"
              class="breadcrumb-size-wrapper"
              hidden>

            <svg class="breadcrumb-arrow"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor"
                 stroke-width="2.5">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M9 5l7 7-7 7"/>
            </svg>

            <span id="breadcrumbSize"
                  class="breadcrumb-current">
            </span>

        </span>

    </header>


    <!-- Main Content -->
    <main class="model-detail-container">

        <!-- Size Picker -->
        <section id="sizePicker" class="size-picker-section">

            <a th:href="@{'/brand/' + ${implant.brand.brandId}}"
               title="Back to brand models"
               aria-label="Back to brand models"
               class="back-button">

                <svg xmlns="http://www.w3.org/2000/svg"
                     class="small-icon"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor"
                     stroke-width="1.8">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M19 12H5m0 0l6-6m-6 6l6 6"/>
                </svg>

            </a>

            <h1 class="size-picker-title"
                th:text="${implant.modelName}">
                Model
            </h1>

            <p class="size-picker-description">
                Choose an implant size to view its details.
            </p>

            <div id="sizeCards" class="size-card-grid"></div>

            <p id="noSizes" class="no-sizes" hidden>
                Size information not available
            </p>

        </section>


        <!-- Implant Detail -->
        <section id="detailView"
                 class="detail-view-section"
                 hidden>

            <a th:href="@{'/model/' + ${implant.modelId}}"
               title="Back to sizes"
               aria-label="Back to sizes"
               class="back-button">

                <svg xmlns="http://www.w3.org/2000/svg"
                     class="small-icon"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor"
                     stroke-width="1.8">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M19 12H5m0 0l6-6m-6 6l6 6"/>
                </svg>

            </a>


            <div class="implant-detail-grid">

                <!-- Implant Image -->
                <div class="implant-image">

                    <img th:src="${implant.imageUrl}"
                         class="implant-main-image"
                         alt="Implant Detail">

                </div>


                <!-- Implant Information -->
                <div class="implant-info">

                    <span class="implant-brand-label"
                          th:text="${implant.brand.brandName}">
                    </span>

                    <h1 class="implant-model-heading"
                        th:text="${implant.modelName}">
                    </h1>


                    <!-- Information Table -->
                    <div class="implant-info-table">

                        <div class="implant-info-row shaded-row">
                            <span class="info-label">Brand</span>
                            <span class="info-value"
                                  th:text="${implant.brand.brandName}">
                            </span>
                        </div>

                        <div class="implant-info-row">
                            <span class="info-label">Model</span>
                            <span class="info-value"
                                  th:text="${implant.modelName}">
                            </span>
                        </div>

                        <div class="implant-info-row shaded-row">
                            <span class="info-label">Material</span>
                            <span class="info-value"
                                  th:text="${implant.material}">
                            </span>
                        </div>

                        <div class="implant-info-row">
                            <span class="info-label">Type</span>
                            <span class="info-value"
                                  th:text="${implant.type}">
                            </span>
                        </div>

                        <div class="implant-info-row shaded-row">
                            <span class="info-label">Surface</span>
                            <span class="info-value"
                                  th:text="${implant.surfaceTreatment}">
                            </span>
                        </div>

                        <div class="implant-info-row">
                            <span class="info-label">Connection</span>
                            <span class="info-value"
                                  th:text="${implant.connectionType}">
                            </span>
                        </div>

                        <div class="implant-info-row shaded-row">
                            <span class="info-label">Country</span>
                            <span class="info-value"
                                  th:text="${implant.country}">
                            </span>
                        </div>

                    </div>


                    <!-- Selected Size -->
                    <div class="selected-size-card">

                        <p class="selected-size-label">Size</p>

                        <p id="selected" class="selected-size"></p>

                        <p id="variants" class="size-variants"></p>

                    </div>

                    <p id="detailNoSizes" class="no-sizes" hidden>
                        Size information not available
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- Back to Admin -->
    <a id="backToAdmin"
       href="/admin/data-management"
       onclick="try { sessionStorage.removeItem('adminPreview'); } catch (e) {}"
       class="admin-back-button">

        <span class="admin-back-icon-wrap">

            <svg xmlns="http://www.w3.org/2000/svg"
                 class="small-icon"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor"
                 stroke-width="2">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M19 12H5m0 0l6-6m-6 6l6 6"/>
            </svg>

        </span>

        Back to Admin

    </a>


    <!-- Size Selection Script -->
    <script th:inline="javascript">

        const raw = /*[[${implant.sizes}]]*/ '';
        const modelName = /*[[${implant.modelName}]]*/ '';
        const imageUrl = /*[[${implant.imageUrl}]]*/ '';

        // Parse implant sizes from the database.
        const re = /Ø\s*([\d.]+)\s*x\s*([\d.]+)\s*mm(?:\s*\(([^)]*)\))?/g;

        const sizes = new Map();
        let m;

        while (raw && (m = re.exec(raw)) !== null) {

            const diameter = parseFloat(m[1]);
            const length = parseFloat(m[2]);

            if (!sizes.has(diameter)) {
                sizes.set(diameter, new Map());
            }

            const lengths = sizes.get(diameter);

            if (!lengths.has(length)) {
                lengths.set(length, []);
            }

            if (m[3]) {
                lengths.get(length).push(m[3]);
            }
        }


        const sizeCards = document.getElementById('sizeCards');
        const sizePicker = document.getElementById('sizePicker');
        const detailView = document.getElementById('detailView');

        const sizeParams = new URLSearchParams(window.location.search);

        const selectedDiameter = Number(sizeParams.get('diameter'));
        const selectedLength = Number(sizeParams.get('length'));

        const hasSizes = sizes.size > 0;


        // Create a card for each available implant size.
        [...sizes.keys()]
            .sort((a, b) => a - b)
            .forEach(diameter => {

                [...sizes.get(diameter).keys()]
                    .sort((a, b) => a - b)
                    .forEach(length => {

                        const card = document.createElement('a');
                        const image = document.createElement('img');
                        const imageBox = document.createElement('div');
                        const title = document.createElement('h2');
                        const size = document.createElement('p');

                        const notes = sizes.get(diameter).get(length);

                        card.className = 'size-card';

                        card.href = window.location.pathname
                            + '?diameter=' + encodeURIComponent(diameter)
                            + '&length=' + encodeURIComponent(length);

                        // Implant image
                        image.src = imageUrl;
                        image.alt = modelName;
                        image.loading = 'lazy';

                        image.onerror = () => {
                            image.style.display = 'none';

                            imageBox.querySelector(
                                '.size-image-fallback'
                            ).hidden = false;
                        };

                        imageBox.className = 'size-card-image';
                        imageBox.append(image);

                        // Fallback icon
                        const fallback = document.createElement('span');

                        fallback.className = 'size-image-fallback';
                        fallback.textContent = '🦷';
                        fallback.hidden = true;

                        imageBox.append(fallback);

                        // Model name
                        title.className = 'size-card-title';
                        title.textContent = modelName;

                        // Implant dimensions
                        size.className = 'size-card-dimensions';
                        size.textContent =
                            'Ø ' + diameter + ' x ' + length + ' mm';

                        card.append(imageBox, title, size);

                        // Additional size information
                        if (notes.length) {

                            const variant = document.createElement('p');

                            variant.className = 'size-card-variant';
                            variant.textContent = notes.join(' · ');

                            card.append(variant);
                        }

                        sizeCards.append(card);

                    });

            });


        // Check whether the selected size exists.
        const validSelection = hasSizes
            && sizes.has(selectedDiameter)
            && sizes.get(selectedDiameter).has(selectedLength);


        if (validSelection) {

            sizePicker.hidden = true;
            detailView.hidden = false;

            const selectedSizeText =
                'Ø ' + selectedDiameter + ' x ' + selectedLength + ' mm';

            document.getElementById('selected').textContent =
                selectedSizeText;

            const notes = sizes.get(selectedDiameter).get(selectedLength);

            document.getElementById('variants').textContent =
                notes.length
                    ? 'Variants: ' + notes.join(' · ')
                    : '';

            // Update breadcrumb with selected size
            document.getElementById('breadcrumbSize').textContent =
                selectedSizeText;

            document.getElementById('breadcrumbSizeWrapper').hidden = false;

        } else if (hasSizes) {

            document.getElementById('noSizes').hidden = true;

        } else {

            sizePicker.hidden = false;
            sizeCards.hidden = true;

            document.getElementById('noSizes').hidden = false;

            detailView.hidden = false;

            document.getElementById('detailNoSizes').hidden = false;
        }

    </script>


    <!-- Admin Preview Script -->
    <script>

        try {

            if (sessionStorage.getItem('adminPreview') === '1') {

                const button = document.getElementById('backToAdmin');

                button.classList.add('is-visible');
            }

        } catch (e) {}

    </script>

</body>
</html>
