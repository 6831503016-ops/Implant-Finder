<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Model Detail</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/model-detail.css}">
</head>

<body class="bg-[#f4f7fc] min-h-screen">

    <!-- Top bar (breadcrumb) -->
    <header class="w-full bg-[#002054] text-white px-8 py-4 flex items-center gap-3 flex-wrap">
        <a href="/" class="flex items-center gap-2 font-extrabold text-lg">
            <span class="text-2xl">🦷</span>
            Implant
        </a>

        <svg class="w-4 h-4 text-white/80 shrink-0" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
        </svg>

        <a href="/" class="text-sm font-semibold hover:underline">Home page</a>

        <svg class="w-4 h-4 text-white/80 shrink-0" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
        </svg>

        <a th:href="@{'/brand/' + ${implant.brand.brandId}}"
           class="text-sm font-semibold hover:underline">
            Brand models
        </a>

        <svg class="w-4 h-4 text-white/80 shrink-0" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
        </svg>

        <span class="text-sm font-semibold" th:text="${implant.modelName}">Model</span>
    </header>

    <main class="model-detail-container">
        <section id="sizePicker">
            <a th:href="@{'/brand/' + ${implant.brand.brandId}}"
               title="Back to brand models"
               aria-label="Back to brand models"
               class="w-11 h-11 shrink-0 bg-white rounded-xl shadow-md inline-flex items-center justify-center text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition mb-6">
                <svg xmlns="http://www.w3.org/2000/svg"
                     class="w-5 h-5"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor"
                     stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M19 12H5m0 0l6-6m-6 6l6 6"/>
                </svg>
            </a>

            <h1 class="size-picker-title" th:text="${implant.modelName}">Model</h1>
            <p class="size-picker-description">Choose an implant size to view its details.</p>
            <div id="sizeCards" class="size-card-grid"></div>
            <p id="noSizes" class="no-sizes" hidden>
                Size information not available
            </p>
        </section>

        <section id="detailView" hidden>
            <a th:href="@{'/model/' + ${implant.modelId}}"
               title="Back to sizes"
               aria-label="Back to sizes"
               class="w-11 h-11 shrink-0 bg-white rounded-xl shadow-md inline-flex items-center justify-center text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition mb-6">
                <svg xmlns="http://www.w3.org/2000/svg"
                     class="w-5 h-5"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor"
                     stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M19 12H5m0 0l6-6m-6 6l6 6"/>
                </svg>
            </a>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
                <div class="bg-black rounded-3xl p-8 flex items-center justify-center shadow-md h-96 overflow-hidden">
                    <img th:src="${implant.imageUrl}"
                         class="max-h-80 object-contain"
                         alt="Implant Detail">
                </div>

                <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-100">
                    <span class="font-bold text-blue-900 uppercase tracking-wide"
                          th:text="${implant.brand.brandName}"></span>

                    <h1 class="text-3xl font-extrabold text-[#0b2545] mt-1 mb-6"
                        th:text="${implant.modelName}"></h1>

                    <div class="mb-8 text-sm rounded-lg overflow-hidden">
                        <div class="flex justify-between p-2.5 bg-blue-50/60">
                            <span class="font-bold text-slate-800">Brand</span>
                            <span class="text-slate-600 text-right"
                                  th:text="${implant.brand.brandName}"></span>
                        </div>
                        <div class="flex justify-between p-2.5">
                            <span class="font-bold text-slate-800">Model</span>
                            <span class="text-slate-600 text-right"
                                  th:text="${implant.modelName}"></span>
                        </div>
                        <div class="flex justify-between p-2.5 bg-blue-50/60">
                            <span class="font-bold text-slate-800">Material</span>
                            <span class="text-slate-600 text-right"
                                  th:text="${implant.material}"></span>
                        </div>
                        <div class="flex justify-between p-2.5">
                            <span class="font-bold text-slate-800">Type</span>
                            <span class="text-slate-600 text-right"
                                  th:text="${implant.type}"></span>
                        </div>
                        <div class="flex justify-between p-2.5 bg-blue-50/60">
                            <span class="font-bold text-slate-800">Surface</span>
                            <span class="text-slate-600 text-right"
                                  th:text="${implant.surfaceTreatment}"></span>
                        </div>
                        <div class="flex justify-between p-2.5">
                            <span class="font-bold text-slate-800">Connection</span>
                            <span class="text-slate-600 text-right"
                                  th:text="${implant.connectionType}"></span>
                        </div>
                        <div class="flex justify-between p-2.5 bg-blue-50/60">
                            <span class="font-bold text-slate-800">Country</span>
                            <span class="text-slate-600 text-right"
                                  th:text="${implant.country}"></span>
                        </div>
                    </div>

                    <div class="selected-size-card">
                        <p class="selected-size-label">Size</p>
                        <p id="selected" class="selected-size"></p>
                        <p id="variants" class="size-variants"></p>
                    </div>
                    <p id="detailNoSizes" class="no-sizes" hidden>
                        Size information not available
                    </p>
                </div>
            </div>
        </section>
    </main>

    <!-- Back to Admin -->
    <a id="backToAdmin"
       href="/admin/data-management"
       onclick="try { sessionStorage.removeItem('adminPreview'); } catch (e) {}"
       class="hidden fixed bottom-6 right-6 z-50 items-center gap-2 pl-3 pr-5 py-3 bg-[#0a192f] text-white rounded-2xl shadow-lg hover:bg-[#13294b] transition text-sm font-bold">

        <span class="w-8 h-8 bg-white/10 rounded-xl flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg"
                 class="w-4 h-4"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor"
                 stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M19 12H5m0 0l6-6m-6 6l6 6"/>
            </svg>
        </span>

        Back to Admin
    </a>

    <script th:inline="javascript">
        const raw = /*[[${implant.sizes}]]*/ '';
        const modelName = /*[[${implant.modelName}]]*/ '';
        const imageUrl = /*[[${implant.imageUrl}]]*/ '';

        // Parses "Ø 3.5 x 8 mm" and optional "(note)" entries
        const re = /Ø\s*([\d.]+)\s*x\s*([\d.]+)\s*mm(?:\s*\(([^)]*)\))?/g;

        const sizes = new Map();
        let m;

        while (raw && (m = re.exec(raw)) !== null) {
            const d = parseFloat(m[1]);
            const l = parseFloat(m[2]);

            if (!sizes.has(d)) {
                sizes.set(d, new Map());
            }

            const lens = sizes.get(d);

            if (!lens.has(l)) {
                lens.set(l, []);
            }

            if (m[3]) {
                lens.get(l).push(m[3]);
            }
        }

        const sizeCards = document.getElementById('sizeCards');
        const sizePicker = document.getElementById('sizePicker');
        const detailView = document.getElementById('detailView');
        const sizeParams = new URLSearchParams(window.location.search);
        const selectedDiameter = Number(sizeParams.get('diameter'));
        const selectedLength = Number(sizeParams.get('length'));
        const hasSizes = sizes.size > 0;

        [...sizes.keys()].sort((a, b) => a - b).forEach(diameter => {
            [...sizes.get(diameter).keys()].sort((a, b) => a - b).forEach(length => {
                const card = document.createElement('a');
                const image = document.createElement('img');
                const imageBox = document.createElement('div');
                const title = document.createElement('h2');
                const size = document.createElement('p');
                const notes = sizes.get(diameter).get(length);

                card.className = 'size-card';
                card.href = window.location.pathname
                    + '?diameter=' + encodeURIComponent(diameter)
                    + '&length=' + encodeURIComponent(length);

                image.src = imageUrl;
                image.alt = modelName;
                image.loading = 'lazy';
                image.onerror = () => {
                    image.style.display = 'none';
                    imageBox.querySelector('.size-image-fallback').hidden = false;
                };
                imageBox.className = 'size-card-image';
                imageBox.append(image);

                const fallback = document.createElement('span');
                fallback.className = 'size-image-fallback';
                fallback.textContent = '🦷';
                fallback.hidden = true;
                imageBox.append(fallback);

                title.className = 'size-card-title';
                title.textContent = modelName;
                size.className = 'size-card-dimensions';
                size.textContent = 'Ø ' + diameter + ' x ' + length + ' mm';

                card.append(imageBox, title, size);
                if (notes.length) {
                    const variant = document.createElement('p');
                    variant.className = 'size-card-variant';
                    variant.textContent = notes.join(' · ');
                    card.append(variant);
                }
                sizeCards.append(card);
            });
        });

        const validSelection = hasSizes
            && sizes.has(selectedDiameter)
            && sizes.get(selectedDiameter).has(selectedLength);

        if (validSelection) {
            sizePicker.hidden = true;
            detailView.hidden = false;
            document.getElementById('selected').textContent =
                'Ø ' + selectedDiameter + ' x ' + selectedLength + ' mm';
            const notes = sizes.get(selectedDiameter).get(selectedLength);
            document.getElementById('variants').textContent =
                notes.length ? 'Variants: ' + notes.join(' · ') : '';
        } else if (hasSizes) {
            document.getElementById('noSizes').hidden = true;
        } else {
            sizePicker.hidden = false;
            sizeCards.hidden = true;
            document.getElementById('noSizes').hidden = false;
            detailView.hidden = false;
            document.getElementById('detailNoSizes').hidden = false;
        }
    </script>

    <script>
        try {
            if (sessionStorage.getItem('adminPreview') === '1') {
                const btn = document.getElementById('backToAdmin');
                btn.classList.remove('hidden');
                btn.classList.add('flex');
            }
        } catch (e) {}
    </script>

</body>
</html>
