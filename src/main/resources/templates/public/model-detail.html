<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Model Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#f4f7fc] min-h-screen">
       <nav class="px-8 py-4 bg-[#002054] shadow-sm">
        <a href="/" class="font-bold text-lg flex items-center gap-2 text-slate-900"><span>🦷</span> Implant</a>
    </nav>

    <div class="max-w-5xl mx-auto px-6 py-8">
               <!-- Back button -->
        <a th:href="@{'/brand/' + ${implant.brand.brandId}}" title="Back"
           class="w-11 h-11 shrink-0 bg-white rounded-xl shadow-md inline-flex items-center justify-center text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m0 0l6-6m-6 6l6 6" />
            </svg>
        </a>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
            <div class="bg-black rounded-3xl p-8 flex items-center justify-center shadow-md h-96 overflow-hidden">
                <img th:src="${implant.imageUrl}" class="max-h-80 object-contain" alt="Implant Detail">
            </div>

            <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-100">
                <span class="font-bold text-blue-900 uppercase tracking-wide" th:text="${implant.brand.brandName}"></span>
                <h1 class="text-3xl font-extrabold text-[#0b2545] mt-1 mb-6" th:text="${implant.modelName}"></h1>

                <div class="mb-8 text-sm rounded-lg overflow-hidden">
                    <div class="flex justify-between p-2.5 bg-blue-50/60"><span class="font-bold text-slate-800">Brand</span><span class="text-slate-600 text-right" th:text="${implant.brand.brandName}"></span></div>
                    <div class="flex justify-between p-2.5"><span class="font-bold text-slate-800">Model</span><span class="text-slate-600 text-right" th:text="${implant.modelName}"></span></div>
                    <div class="flex justify-between p-2.5 bg-blue-50/60"><span class="font-bold text-slate-800">Material</span><span class="text-slate-600 text-right" th:text="${implant.material}"></span></div>
                    <div class="flex justify-between p-2.5"><span class="font-bold text-slate-800">Type</span><span class="text-slate-600 text-right" th:text="${implant.type}"></span></div>
                    <div class="flex justify-between p-2.5 bg-blue-50/60"><span class="font-bold text-slate-800">Surface</span><span class="text-slate-600 text-right" th:text="${implant.surfaceTreatment}"></span></div>
                    <div class="flex justify-between p-2.5"><span class="font-bold text-slate-800">Connection</span><span class="text-slate-600 text-right" th:text="${implant.connectionType}"></span></div>
                    <div class="flex justify-between p-2.5 bg-blue-50/60"><span class="font-bold text-slate-800">Country</span><span class="text-slate-600 text-right" th:text="${implant.country}"></span></div>
                </div>

                <div id="sizeSection">
                    <h3 class="text-lg font-extrabold text-[#0b2545] mb-3">Diameter</h3>
                    <div id="diameterChips" class="flex flex-wrap gap-2 mb-6"></div>

                    <h3 class="text-lg font-extrabold text-[#0b2545] mb-3">Length</h3>
                    <div id="lengthChips" class="flex flex-wrap gap-2 mb-4"></div>

                    <p id="selected" class="text-sm font-semibold text-blue-700"></p>
                    <p id="variants" class="text-xs text-slate-500 mt-1"></p>
                </div>
                <p id="noSizes" class="hidden text-sm text-slate-400">Size information not available</p>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const raw = /*[[${implant.sizes}]]*/ '';
        // Parses "Ø 3.5 x 8 mm" and optional "(note)" entries
        const re = /Ø\s*([\d.]+)\s*x\s*([\d.]+)\s*mm(?:\s*\(([^)]*)\))?/g;
        const sizes = new Map(); // diameter -> Map(length -> [notes])
        let m;
        while (raw && (m = re.exec(raw)) !== null) {
            const d = parseFloat(m[1]), l = parseFloat(m[2]);
            if (!sizes.has(d)) sizes.set(d, new Map());
            const lens = sizes.get(d);
            if (!lens.has(l)) lens.set(l, []);
            if (m[3]) lens.get(l).push(m[3]);
        }

        const base = 'px-4 py-2 rounded-xl text-sm font-semibold transition ';
        const on = 'bg-blue-600 text-white shadow';
        const off = 'bg-blue-50 text-slate-700 hover:bg-blue-100';
        let selD = null, selL = null;

        function chip(text, active, onClick) {
            const b = document.createElement('button');
            b.type = 'button';
            b.textContent = text;
            b.className = base + (active ? on : off);
            b.onclick = onClick;
            return b;
        }

        function render() {
            const dBox = document.getElementById('diameterChips');
            const lBox = document.getElementById('lengthChips');
            dBox.innerHTML = ''; lBox.innerHTML = '';

            [...sizes.keys()].sort((a, b) => a - b).forEach(d => {
                dBox.appendChild(chip(d + ' mm', d === selD, () => {
                    selD = d;
                    selL = [...sizes.get(d).keys()].sort((a, b) => a - b)[0];
                    render();
                }));
            });

            [...sizes.get(selD).keys()].sort((a, b) => a - b).forEach(l => {
                lBox.appendChild(chip(l + ' mm', l === selL, () => { selL = l; render(); }));
            });

            document.getElementById('selected').textContent = 'Selected: Ø ' + selD + ' x ' + selL + ' mm';
            const notes = sizes.get(selD).get(selL);
            document.getElementById('variants').textContent =
                notes.length ? 'Variants: ' + notes.join(' · ') : '';
        }

        if (sizes.size === 0) {
            document.getElementById('sizeSection').classList.add('hidden');
            document.getElementById('noSizes').classList.remove('hidden');
        } else {
            selD = [...sizes.keys()].sort((a, b) => a - b)[0];
            selL = [...sizes.get(selD).keys()].sort((a, b) => a - b)[0];
            render();
        }
    </script>
    <!-- Back to Admin (shows only when admin clicked "View as user") -->
<a id="backToAdmin" href="/admin/data-management"
   onclick="try { sessionStorage.removeItem('adminPreview'); } catch (e) {}"
   class="hidden fixed bottom-6 right-6 z-50 items-center gap-2 pl-3 pr-5 py-3 bg-[#0a192f] text-white rounded-2xl shadow-lg hover:bg-[#13294b] transition text-sm font-bold">
    <span class="w-8 h-8 bg-white/10 rounded-xl flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m0 0l6-6m-6 6l6 6" />
        </svg>
    </span>
    Back to Admin
</a>

<script>
    try {
        if (sessionStorage.getItem('adminPreview') === '1') {
            const btn = document.getElementById('backToAdmin');
            btn.classList.remove('hidden');
            btn.classList.add('flex');
        }
    } catch (e) {}
</script>
<!-- Back to Admin (shows only when admin clicked "View as user") -->
<a id="backToAdmin" href="/admin/data-management"
   onclick="try { sessionStorage.removeItem('adminPreview'); } catch (e) {}"
   class="hidden fixed bottom-6 right-6 z-50 items-center gap-2 pl-3 pr-5 py-3 bg-[#0a192f] text-white rounded-2xl shadow-lg hover:bg-[#13294b] transition text-sm font-bold">
    <span class="w-8 h-8 bg-white/10 rounded-xl flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m0 0l6-6m-6 6l6 6" />
        </svg>
    </span>
    Back to Admin
</a>

<script>
    try {
        if (sessionStorage.getItem('adminPreview') === '1') {
            const btn = document.getElementById('backToAdmin');
            btn.classList.remove('hidden');
            btn.classList.add('flex');
        }
    } catch (e) {}
</script>
</body>
</html>
