<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Implant Models</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .page-content {
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 32px 40px 48px;
            box-sizing: border-box;
        }

        .brand-banner {
            width: 100%;
        }

        .model-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 24px;
            width: 100%;
        }

        .model-card {
            min-width: 0;
        }

        @media (max-width: 640px) {
            .page-content {
                padding: 24px 16px 32px;
            }

            .brand-banner {
                padding: 24px;
                align-items: stretch;
            }

            .brand-banner-content {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }

            .brand-logo {
                border-right: 0;
                border-bottom: 2px solid #cbd5e1;
                padding: 0 0 16px;
                width: 100%;
            }

            .model-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 14px;
            }

            .model-card {
                padding: 12px;
            }

            .model-image {
                height: 130px;
            }
        }
    </style>
</head>

<body class="bg-[#f4f7fc] min-h-screen">
    <nav class="px-8 py-4 bg-[#0a2a5e] text-white">
        <a href="/" class="text-lg font-bold flex items-center gap-2 text-white">
            <span>🦷</span> Implant
        </a>
    </nav>

    <main class="page-content">
        
              <!-- Back button -->
        <a href="/" title="Back"
           class="w-11 h-11 shrink-0 bg-white rounded-xl shadow-md inline-flex items-center justify-center text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m0 0l6-6m-6 6l6 6" />
            </svg>
        </a>

        <section class="brand-banner bg-gradient-to-r from-[#eef4ff] to-[#e0ebff] rounded-3xl p-8 flex flex-col md:flex-row justify-between items-center gap-6 mb-8 shadow-sm">
            <div class="brand-banner-content flex items-center gap-6">
                <div class="brand-logo pr-6 border-r-2 border-slate-300 min-w-[8rem] flex items-center">
                    <img th:if="${brand != null and brand.logoUrl != null and !#strings.isEmpty(brand.logoUrl)}"
                         th:src="${brand.logoUrl}"
                         th:alt="${brand.brandName}"
                         class="max-h-16 max-w-[10rem] object-contain"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">

                    <span class="text-3xl font-black text-blue-900"
                          th:style="${brand != null and brand.logoUrl != null and !#strings.isEmpty(brand.logoUrl)} ? 'display:none' : ''"
                          th:text="${brand != null ? brand.brandName : 'Brand'}">
                    </span>
                </div>

                <div>
                    <p class="text-blue-600 font-semibold text-sm"
                       th:text="${brand != null ? brand.brandName : 'Brand'}">
                    </p>
                    <h1 class="text-3xl font-extrabold text-[#0b2545]">Implant Models</h1>
                </div>
            </div>

            <div class="relative w-full md:w-80">
                <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">🔍</span>
                <input type="text"
                       id="searchModels"
                       oninput="filterModels()"
                       placeholder="Search models..."
                       class="w-full pl-11 pr-4 py-3 bg-white rounded-full text-sm shadow-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </section>

        <p th:if="${models == null or #lists.isEmpty(models)}"
           class="text-center text-slate-400 py-16">
            No models available for this brand yet.
        </p>

        <section class="model-grid" id="modelGrid">
            <a th:each="m : ${models}"
               th:href="@{'/model/' + ${m.modelId}}"
               class="model-card bg-white p-4 rounded-2xl shadow-sm border border-slate-100 text-center hover:shadow-md hover:-translate-y-0.5 transition block">
                <div class="model-image bg-black rounded-xl p-4 h-36 flex items-center justify-center mb-3 overflow-hidden">
                    <img th:src="${m.imageUrl}"
                         class="max-h-28 max-w-full object-contain"
                         th:alt="${m.modelName}">
                </div>

                <h3 class="model-title font-bold text-[#0b2545] text-sm"
                    th:text="${m.modelName}">
                </h3>
            </a>
        </section>

        <p id="noModel" class="hidden text-center text-slate-400 mt-8">
            No models found.
        </p>
    </main>

    <script>
        function filterModels() {
            const query = document.getElementById('searchModels').value.toLowerCase().trim();
            let shown = 0;

            document.querySelectorAll('.model-card').forEach(card => {
                const modelName = card.querySelector('.model-title').textContent.toLowerCase();
                const matches = modelName.includes(query);

                card.style.display = matches ? 'block' : 'none';

                if (matches) {
                    shown++;
                }
            });

            document.getElementById('noModel').classList.toggle('hidden', shown > 0);
        }
    </script>
    <!-- Back to Admin (shows only when admin clicked "View as user") -->
<a id="backToAdmin" href="/admin/data-management"
   onclick="try { sessionStorage.removeItem('adminPreview'); } catch (e) {}"
   class="hidden fixed bottom-6 right-6 z-50 items-center gap-2 pl-3 pr-5 py-3 bg-[#0a192f] text-white rounded-2xl shadow-lg hover:bg-[#13294b] transition text-sm font-bold">
    <span class="w-8 h-8 bg-white/10 rounded-xl flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m0 0l6-6m-6 6l6 6" />
        </svg>
    </span>
    Back to Admin
</a>

<script>
    try {
        if (sessionStorage.getItem('adminPreview') === '1') {
            const btn = document.getElementById('backToAdmin');
            btn.classList.remove('hidden');
            btn.classList.add('flex');
        }
    } catch (e) {}
</script>
</body>
</html>
