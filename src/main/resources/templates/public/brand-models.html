<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Implant Models</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#f4f7fc] min-h-screen">
    <nav class="px-8 py-4 bg-[#0a192f] text-white flex justify-between items-center">
        <a href="/" class="text-lg font-bold flex items-center gap-2 text-white"><span>🦷</span> Implant</a>
    </nav>

    <div class="max-w-6xl mx-auto px-6 py-8">
        <a href="/" class="inline-flex items-center justify-center w-10 h-10 bg-white rounded-xl shadow-sm mb-6 text-slate-700 hover:bg-slate-50 transition">←</a>

        <div class="bg-gradient-to-r from-[#eef4ff] to-[#e0ebff] rounded-3xl p-8 flex flex-col md:flex-row justify-between items-center gap-6 mb-8 shadow-sm">
            <div class="flex items-center gap-6">
                <div class="text-3xl font-black text-blue-900 border-r-2 border-slate-300 pr-6" th:text="${brand != null ? brand.brandName : 'Brand'}"></div>
                <div>
                    <p class="text-blue-600 font-semibold text-sm" th:text="${brand != null ? brand.brandName : 'Brand'}"></p>
                    <h1 class="text-3xl font-extrabold text-slate-900">Implant Models</h1>
                </div>
            </div>
            <div class="relative w-full md:w-80">
                <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">🔍</span>
                <input type="text" id="searchModels" onkeyup="filterModels()" placeholder="Search models..." class="w-full pl-11 pr-4 py-3 bg-white rounded-full text-sm border-none shadow-sm outline-none">
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-6 gap-5" id="modelGrid">
            <div th:each="m : ${models}" class="model-card bg-white p-4 rounded-2xl shadow-sm border border-slate-100 text-center hover:shadow-md transition">
                <a th:href="@{'/model/' + ${m.modelId}}">
                    <div class="bg-black rounded-xl p-4 h-36 flex items-center justify-center mb-3">
                        <img th:src="${m.imageUrl}" class="max-h-28 object-contain" alt="Implant">
                    </div>
                    <h3 class="font-bold text-slate-800 text-sm model-title" th:text="${m.modelName}"></h3>
                </a>
            </div>
        </div>
    </div>

    <script>
        function filterModels() {
            let input = document.getElementById('searchModels').value.toLowerCase();
            let cards = document.getElementsByClassName('model-card');
            for (let card of cards) {
                let name = card.querySelector('.model-title').innerText.toLowerCase();
                card.style.display = name.includes(input) ? 'block' : 'none';
            }
        }
    </script>
</body>
</html>
