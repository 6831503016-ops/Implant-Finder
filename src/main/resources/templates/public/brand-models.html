
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${brand.brandName + ' Models'}">Brand Models</title>

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/brand-models.css}">
    <link rel="stylesheet" th:href="@{/css/contact-popup.css}">
</head>

<body class="brand-page">

    <!-- ===== Navbar ===== -->
    <header class="topbar">
        <a th:href="@{/}" class="site-logo" aria-label="Implant Finder home">
            <img th:src="@{/images/logo.png}" alt="Implant Finder">
        </a>

        <a href="mailto:admin@implant.com" class="contact-btn" aria-label="Contact admin">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 14v-2a8 8 0 0 1 16 0v2"/>
                <rect x="3" y="13" width="4" height="6" rx="1.5"/>
                <rect x="17" y="13" width="4" height="6" rx="1.5"/>
                <path d="M19 19c0 1.5-1.8 2.5-4 2.5h-2"/>
            </svg>
        </a>
    </header>

    <main class="brand-main">

        <!-- ===== Back + Breadcrumb ===== -->
        <nav class="page-nav" aria-label="Breadcrumb">
            <a th:href="@{/}" class="back-btn" title="Back to Home" aria-label="Back to Home">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m0 0l6-6m-6 6l6 6"/>
                </svg>
            </a>

            <div class="crumbs">
                <a th:href="@{/}">Home</a>

                <svg class="chev" viewBox="0 0 11 16" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 2.5 8.5 8 3 13.5"/>
                </svg>

                <!-- ชื่อแบรนด์ที่กดเข้ามา -->
                <span aria-current="page" th:text="${brand.brandName}">Brand</span>
            </div>
        </nav>

        <!-- ===== Brand Banner ===== -->
        <section class="brand-banner">

            <!-- โลโก้แบรนด์ -->
            <div class="brand-banner-logo">
                <img th:if="${brand.logoUrl != null and !#strings.isEmpty(brand.logoUrl)}"
                     th:src="${brand.logoUrl}"
                     th:alt="${brand.brandName + ' logo'}"
                     onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden')">

                <span class="brand-name-fallback"
                      th:classappend="${brand.logoUrl != null and !#strings.isEmpty(brand.logoUrl)} ? ' hidden' : ''"
                      th:text="${brand.brandName}">Brand</span>
            </div>

            <span class="brand-divider" aria-hidden="true"></span>

            <!-- ชื่อแบรนด์และประเทศ -->
            <div class="brand-banner-text">
                <p class="brand-label">
                    Dental Implant Models
                    <span th:if="${brand.country != null and !#strings.isEmpty(brand.country)}"
                          th:text="${' · ' + brand.country}"></span>
                </p>

                <h1 class="brand-title" th:text="${brand.brandName}">Brand Name</h1>
            </div>

            <!-- ช่องค้นหารุ่น -->
            <div class="model-search">
                <input type="text" id="searchModels" placeholder="Search models..."
                       aria-label="Search implant models" autocomplete="off">

                <span class="model-search-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                         stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7.5"/>
                        <path d="m20 20-3.6-3.6"/>
                    </svg>
                </span>
            </div>

        </section>

        <!-- ===== Models ===== -->
        <section class="models-section">

            <!-- แสดงข้อความเมื่อไม่มี Model ในแบรนด์นี้ -->
            <div th:if="${#lists.isEmpty(models)}" class="empty-message">
                No implant models are currently available for this brand.
            </div>

            <!-- แสดงรายการ Model -->
            <div id="modelGrid" class="model-grid" th:if="${not #lists.isEmpty(models)}">

                <a th:each="model : ${models}"
                   th:href="@{'/model/' + ${model.modelId}}"
                   class="model-card">

                    <div class="model-image">
                        <img th:if="${model.imageUrl != null and !#strings.isEmpty(model.imageUrl)}"
                             th:src="${model.imageUrl}"
                             th:alt="${model.modelName}"
                             loading="lazy"
                             onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden')">

                        <div class="model-image-fallback"
                             th:classappend="${model.imageUrl != null and !#strings.isEmpty(model.imageUrl)} ? ' hidden' : ''">
                            <span>🦷</span>
                            <p>Image unavailable</p>
                        </div>
                    </div>

                    <h3 class="model-title" th:text="${model.modelName}">Model Name</h3>

                    <span class="model-cta">
                        View sizes
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M5 12h14m-6-6 6 6-6 6"/>
                        </svg>
                    </span>

                </a>
            </div>

            <!-- แสดงข้อความเมื่อค้นหาไม่พบ Model -->
            <p id="noModels" class="no-model-message" hidden>
                No matching implant models found.
            </p>

        </section>
    </main>

    <!-- ===== Back to Admin (เฉพาะตอน admin preview) ===== -->
    <a id="backToAdmin"
       th:href="@{/admin/data-management}"
       onclick="try { sessionStorage.removeItem('adminPreview'); } catch (e) {}"
       class="back-to-admin">

        <svg class="back-to-admin-icon" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m0 0l6-6m-6 6l6 6"/>
        </svg>

        Back to Admin
    </a>

    <!-- ===== JavaScript: ค้นหา Implant Models ===== -->
    <script th:src="@{/js/model-search.js}"></script>

    <!-- ===== JavaScript: Back to Admin ===== -->
    <script th:src="@{/js/admin-preview.js}"></script>

    <!-- ===== JavaScript: Contact Admin Popup ===== -->
    <script th:src="@{/js/contact-popup.js}"></script>

</body>
</html>
