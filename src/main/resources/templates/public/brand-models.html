<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${brand.brandName + ' Models'}">Brand Models</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
          rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" th:href="@{/css/brand-models.css}">
</head>

<body>

    <!-- ========================================
         Top Bar / Breadcrumb
    ========================================= -->
    <header class="top-bar">

        <a href="/" class="top-brand">
            <span class="top-brand-icon">🦷</span>
            <span>Implant</span>
        </a>

        <!-- Breadcrumb: Home -->
        <svg class="breadcrumb-icon"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor"
             stroke-width="2.5">
            <path stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M9 5l7 7-7 7"/>
        </svg>


        <span class="breadcrumb-current"
              th:text="${brand.brandName}">
            Brand Models
        </span>

    </header>


    <!-- ========================================
         Main Content
    ========================================= -->
    <main class="page-content">

        <!-- Back Button -->
        <a href="/"
           class="back-button"
           title="Back to Home"
           aria-label="Back to Home">

            <svg xmlns="http://www.w3.org/2000/svg"
                 width="20"
                 height="20"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor"
                 stroke-width="1.8">

                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M19 12H5m0 0l6-6m-6 6l6 6"/>

            </svg>

        </a>


        <!-- ========================================
             Brand Banner
        ========================================= -->
        <section class="brand-banner">

            <!-- Brand Information -->
            <div class="brand-banner-content">

                <!-- Brand Logo -->
                <div class="brand-logo">

                    <img th:if="${brand.logoUrl != null and !#strings.isEmpty(brand.logoUrl)}"
                         th:src="${brand.logoUrl}"
                         th:alt="${brand.brandName + ' logo'}"
                         onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden')">

                    <!-- Fallback when logo is unavailable -->
                    <span class="brand-name-fallback hidden"
                          th:text="${brand.brandName}">
                        Brand Name
                    </span>

                </div>


                <!-- Brand Details -->
                <div class="brand-info">

                    <p class="brand-label">
                        Dental Implant Brand
                    </p>

                    <h1 class="page-title"
                        th:text="${brand.brandName}">
                        Brand Name
                    </h1>

                    <p class="brand-country"
                       th:text="${brand.country != null and !#strings.isEmpty(brand.country) ? brand.country : 'Country not specified'}">
                        Country
                    </p>

                </div>

            </div>


            <!-- Search Models -->
            <div class="search-container">

                <input type="text"
                       id="searchModels"
                       placeholder="Search models..."
                       aria-label="Search implant models"
                       autocomplete="off">

                <!-- Search Icon: Right Side -->
                <span class="search-icon" aria-hidden="true">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <circle cx="11" cy="11" r="8"/>

                        <path d="m21 21-4.34-4.34"/>

                    </svg>

                </span>

            </div>

        </section>


        <!-- ========================================
             Model Section
        ========================================= -->
        <section class="models-section">

            <!-- Empty State: No Models in Database -->
            <div th:if="${#lists.isEmpty(models)}"
                 class="empty-message">

                <p>No implant models are currently available for this brand.</p>

            </div>


            <!-- Model Grid -->
            <div id="modelGrid"
                 class="model-grid"
                 th:if="${not #lists.isEmpty(models)}">

                <!-- Model Card -->
                <a th:each="model : ${models}"
                   th:href="@{'/model/' + ${model.modelId}}"
                   class="model-card">

                    <!-- Model Image -->
                    <div class="model-image">

                        <img th:if="${model.imageUrl != null and !#strings.isEmpty(model.imageUrl)}"
                             th:src="${model.imageUrl}"
                             th:alt="${model.modelName}"
                             loading="lazy"
                             onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden')">

                        <!-- Fallback when image is unavailable -->
                        <div class="model-image-fallback hidden">
                            <span>🦷</span>
                            <p>Image unavailable</p>
                        </div>

                    </div>


                    <!-- Model Name -->
                    <h3 class="model-title"
                        th:text="${model.modelName}">
                        Model Name
                    </h3>

                </a>

            </div>


            <!-- No Search Results -->
            <p id="noModels"
               class="no-model-message"
               hidden>
                No matching implant models found.
            </p>

        </section>

    </main>


    <!-- ========================================
         JavaScript: Search Models
    ========================================= -->
    <script>
        const searchInput = document.getElementById('searchModels');
        const modelGrid = document.getElementById('modelGrid');
        const noModels = document.getElementById('noModels');

        function filterModels() {

            const query = searchInput.value
                .toLowerCase()
                .trim();

            const modelCards = document.querySelectorAll('.model-card');

            let shown = 0;

            modelCards.forEach(card => {

                const modelName = card
                    .querySelector('.model-title')
                    .textContent
                    .toLowerCase()
                    .trim();

                const matches = modelName.startsWith(query);

                card.hidden = !matches;

                if (matches) {
                    shown++;
                }

            });

            noModels.hidden = shown > 0;

        }

        searchInput.addEventListener('input', filterModels);
    </script>

</body>
</html>
