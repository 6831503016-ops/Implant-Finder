
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Implant Finder — Find the right implant</title>
    <link rel="stylesheet" th:href="@{/css/admin-notifications.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/homepage.css}">
    <link rel="stylesheet" th:href="@{/css/contact-popup.css}">
</head>
<body class="home-page">

<div th:replace="~{admin/fragment :: notifications}"></div>
    <!-- ===== Navbar ===== -->
    <nav class="topbar">
        <a th:href="@{/}" class="site-logo" aria-label="Implant Finder home">
            <img th:src="@{/images/logo.png}" alt="Implant Finder">
        </a>

        <div class="topbar-actions">
            <!-- ปุ่มติดต่อ admin -->
            <button type="button" id="contactBtn" class="contact-btn"
                    aria-label="Contact admin"
                    aria-expanded="false" aria-controls="contactPop">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 14v-2a8 8 0 0 1 16 0v2"/>
                    <rect x="3" y="13" width="4" height="6" rx="1.5"/>
                    <rect x="17" y="13" width="4" height="6" rx="1.5"/>
                    <path d="M19 19c0 1.5-1.8 2.5-4 2.5h-2"/>
                </svg>
            </button>

            <a th:href="@{/admin/login}" class="admin-login-btn">
                Login
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 12h14m-6-6 6 6-6 6"/>
                </svg>
            </a>
        </div>
    </nav>

    <!-- ===== Hero ===== -->
    <section class="hero" id="hero">
        <div class="hero-bg" aria-hidden="true">
            <span class="blob blob-1"></span>
            <span class="blob blob-2"></span>
            <span class="blob blob-3"></span>
        </div>

        <div class="hero-wave" aria-hidden="true">
            <svg class="wave wave-back" viewBox="0 0 2880 80" preserveAspectRatio="none">
                <path d="M0,40 C180,10 540,70 720,40 C900,10 1260,70 1440,40 C1620,10 1980,70 2160,40 C2340,10 2700,70 2880,40 L2880,80 L0,80 Z"/>
            </svg>

            <svg class="wave wave-front" viewBox="0 0 2880 80" preserveAspectRatio="none">
                <path d="M0,50 C240,20 480,70 720,50 C960,30 1200,75 1440,50 C1680,20 1920,70 2160,50 C2400,30 2640,75 2880,50 L2880,80 L0,80 Z"/>
            </svg>
        </div>

        <div class="hero-content">
            <h1 class="hero-title">
                <span class="hero-line">
                    <span class="hero-word" style="--i:0">Find</span>
                    <span class="hero-word" style="--i:1">the</span>
                    <span class="hero-word" style="--i:2">right</span>
                    <span class="hero-word" style="--i:3">implant</span>
                </span>

                <span class="hero-accent">in just a few seconds</span>
            </h1>

            <p class="hero-subtitle">
                Explore various specifications from leading implant brands in Thailand—all in one place
            </p>

            <div class="hero-search">
                <input type="text" id="searchInput"
                       placeholder="Search implant brands..."
                       aria-label="Search implant brands"
                       autocomplete="off">

                <span class="hero-search-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7.5"/>
                        <path d="m20 20-3.6-3.6"/>
                    </svg>
                </span>
            </div>
        </div>
    </section>

    <!-- ===== Brands ===== -->
    <main class="brands-section">
        <h2 class="brands-title">Brands</h2>

        <div class="brand-grid" id="brandGrid">
            <a th:each="b : ${brands}"
               th:href="@{'/brand/' + ${b.brandId}}"
               class="brand-card"
               data-tilt="7"
               th:attr="data-name=${b.brandName}"
               th:title="${b.brandName}"
               th:aria-label="${b.brandName}">

                <div class="brand-logo-box">
                    <img th:if="${b.logoUrl != null and !#strings.isEmpty(b.logoUrl)}"
                         th:src="${b.logoUrl}"
                         th:alt="${b.brandName}"
                         class="brand-logo">

                    <span class="brand-logo-fallback"
                          th:classappend="${b.logoUrl != null and !#strings.isEmpty(b.logoUrl)} ? ' hidden' : ''"
                          th:text="${b.brandName}">
                    </span>
                </div>
            </a>
        </div>

        <p id="noBrand" class="no-brand-message hidden">
            No brands found.
        </p>
    </main>

    <!-- ===== Back to Admin ===== -->
        <a id="backToAdmin"
       th:href="@{/admin/data-management}"
       class="back-to-admin">

        <svg class="back-to-admin-icon" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M19 12H5m0 0l6-6m-6 6l6 6"/>
        </svg>

        Back to Admin
    </a>

    <!-- ===== JavaScript Files ===== -->

    <!-- ค้นหาแบรนด์ -->
    <script th:src="@{/js/brand-search.js}"></script>

    <!-- แสดงปุ่ม Back to Admin เมื่ออยู่ใน Admin Preview -->
        <script th:src="@{/js/admin-preview.js}"></script>

    <!-- Navbar shadow และ animation ของแบรนด์ -->
    <script th:src="@{/js/homepage-effects.js}"></script>

    <!-- พื้นหลังขยับตามตำแหน่งเมาส์ -->
    <script th:src="@{/js/background-parallax.js}"></script>

    <!-- จัดการรูปภาพโลโก้แบรนด์ -->
    <script th:src="@{/js/brand-logo.js}"></script>

    <!-- การ์ดแบรนด์เอียงแบบ 3D -->
    <script th:src="@{/js/tilt.js}"></script>

    <!-- ปุ่มติดต่อ admin -->
    <script th:src="@{/js/contact-popup.js}"></script>
    <script th:src="@{/js/admin-notifications.js}"></script>
</body>
</html>
