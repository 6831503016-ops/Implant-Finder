<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Find Your Implant</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <span class="navbar-brand-icon">🦷</span>
            <span class="navbar-brand-name">Implant-Finder</span>
        </a>

        <div class="navbar-actions">
            <a href="/admin/login" class="admin-login-bottom">Admin Login</a>

            <button type="button" id="contactBtn" class="contact-bottom"
                    onclick="toggleContact()" aria-label="Contact admin"
                    aria-expanded="false" aria-controls="contactPop">🎧</button>
        </div>
    </nav>

    <!-- Hero Banner -->
    <section class="banner">
        <div class="content">
            <h1>Find Your <span>Implant Brand</span></h1>
            <p>Explore your implant in Thailand</p>

           <div class="search">
                <input
                type="text"
                id="searchInput"
                oninput="filterBrands()"
                placeholder="Search for a brand..."
                aria-label="Search for a brand">

            <span class="search-icon">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.34-4.34" />
        </svg>
    </span>
</div>
        </div>
    </section>

    <!-- Brand Section -->
    <main class="page-content">
        <h2 class="brands">Brands</h2>

        <div class="brand-grid" id="brandGrid">
            <a th:each="b : ${brands}"
               th:href="@{'/brand/' + ${b.brandId}}"
               class="brand-card">

                <div class="brand-logo-container">
                    <img th:if="${b.logoUrl != null and !#strings.isEmpty(b.logoUrl)}"
                         th:src="${b.logoUrl}"
                         th:alt="${b.brandName}"
                         class="brand-logo"
                         onerror="this.style.display='none'; this.nextElementSibling.classList.remove('logo-fallback-hidden')">

                    <span class="brand-logo-fallback"
                          th:classappend="${b.logoUrl != null and !#strings.isEmpty(b.logoUrl)} ? ' logo-fallback-hidden' : ''"
                          th:text="${b.brandName}"></span>
                </div>

                <p class="brand-name" th:text="${b.brandName}"></p>
            </a>
        </div>

        <p id="noBrand" class="no-brand-message hidden">No brands found.</p>
    </main>

    <!-- Contact Admin popup -->
    <div id="contactPop" class="contact-popup hidden" role="dialog" aria-label="Contact admin">
        <div id="contactArrow" class="contact-arrow"></div>

        <div class="contact-popup-heading">
            <div class="contact-popup-icon">🎧</div>
            <div>
                <p class="contact-popup-title">Contact Admin</p>
                <p class="contact-popup-subtitle">We usually reply within 1–2 days</p>
            </div>
        </div>

        <div class="admin-email-row">
            <span id="adminEmail" class="admin-email">admin@implant.com</span>
            <button type="button" onclick="copyEmail()" id="copyBtn" class="copy-btn">Copy</button>
        </div>

        <a href="mailto:admin@implant.com" class="send-email-btn">Send email</a>
    </div>

    <!-- Back to Admin -->
    <a id="backToAdmin" href="/admin/data-management"
       onclick="try { sessionStorage.removeItem('adminPreview'); } catch (e) {}"
       class="back-to-admin hidden">
        <span class="back-to-admin-icon">
            <svg xmlns="http://www.w3.org/2000/svg" class="back-arrow-icon" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M19 12H5m0 0l6-6m-6 6l6 6" />
            </svg>
        </span>
        Back to Admin
    </a>

    <!-- JavaScript: Brand search -->
    <script>
       
function filterBrands() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    let shown = 0;

    document.querySelectorAll('.brand-card').forEach(card => {
        const brandName = card.querySelector('.brand-name').textContent.toLowerCase().trim();

        // Match only brand names that start with the search term
        const matches = brandName.startsWith(query);

        card.style.display = matches ? 'block' : 'none';

        if (matches) {
            shown++;
        }
    });

    document.getElementById('noBrand').classList.toggle('hidden', shown > 0);
}

    </script>

    <!-- JavaScript: Back to Admin -->
    <script>
        try {
            if (sessionStorage.getItem('adminPreview') === '1') {
                const btn = document.getElementById('backToAdmin');
                btn.classList.remove('hidden');
                btn.classList.add('is-visible');
            }
        } catch (e) {}
    </script>

    <!-- JavaScript: Contact Admin popup -->
    <script>
        const ARROW_HALF = 7;
        const OVERHANG = 36;
        const CORNER_SAFE = 24;

        function positionContact() {
            const btn = document.getElementById('contactBtn');
            const pop = document.getElementById('contactPop');
            const arrow = document.getElementById('contactArrow');

            const b = btn.getBoundingClientRect();
            let right = window.innerWidth - b.right - OVERHANG;
            if (right < 8) right = 8;

            pop.style.top = (b.bottom + 12) + 'px';
            pop.style.right = right + 'px';
            pop.style.left = 'auto';

            const p = pop.getBoundingClientRect();
            let arrowLeft = (b.left + b.width / 2) - p.left - ARROW_HALF;

            const min = CORNER_SAFE;
            const max = p.width - CORNER_SAFE - ARROW_HALF * 2;
            arrowLeft = Math.max(min, Math.min(max, arrowLeft));

            arrow.style.right = 'auto';
            arrow.style.left = arrowLeft + 'px';
        }

        function toggleContact() {
            const pop = document.getElementById('contactPop');
            const btn = document.getElementById('contactBtn');
            const open = pop.classList.toggle('hidden') === false;
            btn.setAttribute('aria-expanded', open);
            if (open) positionContact();
        }

        function closeContact() {
            document.getElementById('contactPop').classList.add('hidden');
            document.getElementById('contactBtn').setAttribute('aria-expanded', 'false');
        }

        function copyEmail() {
            const email = document.getElementById('adminEmail').textContent.trim();
            const btn = document.getElementById('copyBtn');

            navigator.clipboard.writeText(email).then(() => {
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = 'Copy', 1500);
            }).catch(() => {
                btn.textContent = 'Select & copy';
            });
        }

        document.addEventListener('click', function (e) {
            const btn = document.getElementById('contactBtn');
            const pop = document.getElementById('contactPop');
            if (!btn.contains(e.target) && !pop.contains(e.target)) closeContact();
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeContact();
        });

        window.addEventListener('resize', function () {
            if (!document.getElementById('contactPop').classList.contains('hidden')) {
                positionContact();
            }
        });

        window.addEventListener('scroll', closeContact);
    </script>
</body>
</html>
