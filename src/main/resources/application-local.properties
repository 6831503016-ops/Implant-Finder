# =========================================================
# LOCAL profile - for running the project on your own computer
# (no Google Cloud account or Cloud SQL access needed)
#
# Run with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
#
# These settings override application.properties only when the
# "local" profile is active. The Cloud Run / Cloud SQL setup in
# application.properties is NOT changed.
# =========================================================

# Local H2 database saved as a file in ./data (already in .gitignore)
# MODE=MySQL keeps SQL behaviour close to Cloud SQL (MySQL)
spring.datasource.url=jdbc:h2:file:./data/implantdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create/update tables from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 web console to look inside the database: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:file:./data/implantdb   User: sa   Password: (empty)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Sample data (brands, materials, models, sizes) is loaded automatically
# from data.sql by DataSeeder the first time, when the database is empty.

# Local administrator password (local database only).
# If APP_ADMIN_PASSWORD is set it is used; otherwise the demo password below.
app.admin.password=${APP_ADMIN_PASSWORD:admin1234}