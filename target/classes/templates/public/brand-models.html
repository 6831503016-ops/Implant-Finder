<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Implant Models</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#f4f7fc] min-h-screen">
    <nav class="px-8 py-4 bg-[#0a2a5e] text-white">
        <a href="/" class="text-lg font-bold flex items-center gap-2 text-white"><span>🦷</span> Implant</a>
    </nav>

    <div class="max-w-6xl mx-auto px-6 py-8">
        <a href="/" class="inline-flex items-center justify-center w-10 h-10 bg-white rounded-xl shadow-sm mb-6 text-slate-700 hover:bg-slate-50 transition">←</a>

        <div class="bg-gradient-to-r from-[#eef4ff] to-[#e0ebff] rounded-3xl p-8 flex flex-col md:flex-row justify-between items-center gap-6 mb-8 shadow-sm">
            <div class="flex items-center gap-6">
                <div class="pr-6 border-r-2 border-slate-300 min-w-[8rem] flex items-center">
                    <img th:if="${brand != null and brand.logoUrl != null and !#strings.isEmpty(brand.logoUrl)}"
                         th:src="${brand.logoUrl}" th:alt="${brand.brandName}" class="max-h-16 max-w-[10rem] object-contain"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
                    <span class="text-3xl font-black text-blue-900"
                          th:style="${brand != null and brand.logoUrl != null and !#strings.isEmpty(brand.logoUrl)} ? 'display:none' : ''"
                          th:text="${brand != null ? brand.brandName : 'Brand'}"></span>
                </div>
                <div>
                    <p class="text-blue-600 font-semibold text-sm" th:text="${brand != null ? brand.brandName : 'Brand'}"></p>
                    <h1 class="text-3xl font-extrabold text-[#0b2545]">Implant Models</h1>
                </div>
            </div>
            <div class="relative w-full md:w-80">
                <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">🔍</span>
                <input type="text" id="searchModels" oninput="filterModels()" placeholder="Search models..."
                       class="w-full pl-11 pr-4 py-3 bg-white rounded-full text-sm shadow-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>

        <p th:if="${models == null or #lists.isEmpty(models)}" class="text-center text-slate-400 py-16">
            No models available for this brand yet.
        </p>

        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-5" id="modelGrid">
            <a th:each="m : ${models}" th:href="@{'/model/' + ${m.modelId}}"
               class="model-card bg-white p-4 rounded-2xl shadow-sm border border-slate-100 text-center hover:shadow-md hover:-translate-y-0.5 transition block">
                <div class="bg-black rounded-xl p-4 h-36 flex items-center justify-center mb-3 overflow-hidden">
                    <img th:src="${m.imageUrl}" class="max-h-28 object-contain" alt="Implant">
                </div>
                <h3 class="model-title font-bold text-[#0b2545] text-sm" th:text="${m.modelName}"></h3>
            </a>
        </div>
        <p id="noModel" class="hidden text-center text-slate-400 mt-8">No models found.</p>
    </div>

    <script>
        function filterModels() {
            const q = document.getElementById('searchModels').value.toLowerCase().trim();
            let shown = 0;
            document.querySelectorAll('.model-card').forEach(card => {
                const match = card.querySelector('.model-title').textContent.toLowerCase().includes(q);
                card.style.display = match ? 'block' : 'none';
                if (match) shown++;
            });
            document.getElementById('noModel').classList.toggle('hidden', shown > 0);
        }
    </script>
</body>
</html>
