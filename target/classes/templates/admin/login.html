<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-xl w-full max-w-4xl overflow-hidden grid grid-cols-1 md:grid-cols-2">
        <div class="bg-[#051329] p-10 flex flex-col justify-between relative overflow-hidden text-white">
            <div class="relative z-10">
                <span class="text-3xl">🦷</span>
            </div>
            <div class="relative z-10 my-auto text-center py-12">
                <img src="https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?w=500&auto=format&fit=crop" class="w-48 h-48 object-cover rounded-full mx-auto border-4 border-blue-500/30 shadow-2xl mb-4" alt="3D Implant">
            </div>
            <p class="text-xs text-slate-400 relative z-10 text-center">Dental Implant Database Management System</p>
        </div>

        <div class="p-10 flex flex-col justify-center">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center gap-2 mb-2">
                    <span class="text-2xl">🦷</span>
                    <span class="text-2xl font-black text-slate-900">Implant</span>
                </div>
                <h2 class="text-3xl font-black text-slate-900">Admin Login</h2>
            </div>

            <form th:action="@{/admin/login}" method="post" class="space-y-4">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">✉</span>
                    <input type="text" name="email" required placeholder="admin@implant.com" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">🔒</span>
                    <input type="password" id="passInput" name="password" required placeholder="Password" class="w-full pl-11 pr-11 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <button type="button" onclick="togglePass()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400">👁</button>
                </div>
                <button type="submit" class="w-full py-3.5 bg-[#2563eb] hover:bg-blue-700 text-white font-extrabold rounded-2xl transition shadow-md">Login</button>
            </form>
        </div>
    </div>

    <script>
        function togglePass() {
            let p = document.getElementById('passInput');
            p.type = p.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
